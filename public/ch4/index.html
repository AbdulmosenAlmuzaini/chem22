<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>مختبر الهيدروكربونات | كيمياء 2-2</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@300;400;500;600;700&family=Noto+Kufi+Arabic:wght@500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#F1EBFC; --surface:#FFFFFF; --surface2:#F8F5FE; --ink:#1E1638; --muted:#5E5677; --line:#DCD2F1; --grid:rgba(124,77,214,.11); --head:var(--ink);
  --cold:#2763D8; --hot:#DE4527; --mid:#8A4FC8; --amber:#D18A0B; --ok:#12916A; --bad:#C7362A; --chip:#ECE4FA; --green:#6D3FC4;
  --cold-soft:#E3ECFC; --hot-soft:#FCE7E2; --ok-soft:#DFF4EC; --bad-soft:#FBE4E1;
  color-scheme:light;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#16112A; --surface:#201A3A; --surface2:#271F45; --ink:#EEE9FA; --muted:#B3A9CF; --line:#3A3160; --grid:rgba(184,140,255,.08); --head:var(--ink);
    --cold:#6E9BFF; --hot:#FF7B5E; --mid:#B88CFF; --amber:#F4BD4C; --ok:#3CC799; --bad:#FF6E61; --chip:#2D2552; --green:#7E55D6;
    --cold-soft:#1C2C55; --hot-soft:#3A2028; --ok-soft:#143A33; --bad-soft:#3D1F25;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#16112A; --surface:#201A3A; --surface2:#271F45; --ink:#EEE9FA; --muted:#B3A9CF; --line:#3A3160; --grid:rgba(184,140,255,.08); --head:var(--ink);
  --cold:#6E9BFF; --hot:#FF7B5E; --mid:#B88CFF; --amber:#F4BD4C; --ok:#3CC799; --bad:#FF6E61; --chip:#2D2552; --green:#7E55D6;
  --cold-soft:#1C2C55; --hot-soft:#3A2028; --ok-soft:#143A33; --bad-soft:#3D1F25;
  color-scheme:dark;
}
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);--thermal:linear-gradient(to left,var(--cold),var(--mid) 55%,var(--hot));}
html{scroll-padding-top:env(safe-area-inset-top,0px);}
*,*::before,*::after{box-sizing:border-box}
body{margin:0;background-color:var(--bg);background-image:linear-gradient(var(--grid) 1px,transparent 1px),linear-gradient(90deg,var(--grid) 1px,transparent 1px);background-size:26px 26px;color:var(--ink);font-family:"IBM Plex Sans Arabic",system-ui,"Segoe UI",Tahoma,sans-serif;font-size:17px;line-height:1.75;-webkit-font-smoothing:antialiased}
img,svg,canvas{max-width:100%}
.kufi,h1,h2,h3,.lnum,.lcode,.gscore,.temp-big,.brand,.lcard h3,.final-band h3,.teacher .av{font-family:"Noto Kufi Arabic","IBM Plex Sans Arabic",system-ui,sans-serif}
.hero h1{font-weight:800;line-height:1.35}
h1,h2,h3,.lcard h3{color:var(--head)}
.lhead h1{color:var(--head)}
.teacher{display:flex;align-items:center;gap:12px;margin:6px 0 20px}
.teacher .av{flex:0 0 48px;height:48px;border-radius:50%;background:var(--cold);color:#fff;display:grid;place-items:center;font-weight:700;font-size:18px}
.teacher small{display:block;color:var(--muted);font-size:15px;line-height:1.4}
.teacher b{display:block;font-size:17px;line-height:1.5}
.wrap{max-width:1100px;margin:0 auto;padding:0 20px}
a{color:var(--cold)}
button{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--amber);outline-offset:2px;border-radius:6px}
.f{font-family:"IBM Plex Sans Arabic",system-ui,sans-serif;unicode-bidi:isolate;display:inline-block;max-width:100%}
.tinput{font:inherit;font-size:15px;padding:8px 10px;border-radius:8px;border:1.5px solid var(--line);background:var(--surface2);color:var(--ink)}
.hcard .f,.target .f,.sum .f,.ctable .f,.ediag .f{white-space:nowrap}
.f sub,.fx sub{font-size:.68em}
.ltr{direction:ltr;unicode-bidi:isolate}

/* top bar */
.top{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:14px 0}
.brand{display:flex;align-items:center;gap:10px;text-decoration:none;color:var(--ink);font-weight:600}
.brand-mark{width:34px;height:34px;border-radius:50%;background:var(--thermal);display:grid;place-items:center;color:#fff;font-size:15px}
.top-tools{display:flex;align-items:center;gap:10px}
.starpill{display:flex;align-items:center;gap:6px;background:var(--surface);border:1px solid var(--line);border-radius:999px;padding:4px 12px;font-weight:600}
.starpill b{color:var(--amber)}
.iconbtn{background:var(--surface);border:1px solid var(--line);border-radius:999px;padding:5px 12px;cursor:pointer;font-size:14px}

/* buttons */
.btn{display:inline-flex;align-items:center;gap:8px;border:0;border-radius:10px;padding:11px 20px;font-weight:600;cursor:pointer;background:var(--ink);color:var(--bg);text-decoration:none;transition:transform .12s}
.btn:active{transform:scale(.97)}
.btn.cold{background:var(--cold);color:#fff}
.btn.hot{background:var(--hot);color:#fff}
.btn.ghost{background:transparent;color:var(--ink);border:1.5px solid var(--line)}
.btn.sm{padding:7px 14px;font-size:15px;border-radius:8px}
.btn[disabled]{opacity:.45;cursor:not-allowed}

/* hero */
.hero{display:grid;grid-template-columns:1.05fr .95fr;gap:36px;align-items:center;padding:26px 0 40px}
.kicker{color:var(--muted);font-size:15px;margin:0 0 6px}
.hero h1{font-size:clamp(2rem,4.6vw,3.25rem);line-height:1.22;margin:0 0 16px;font-weight:700;letter-spacing:-.01em}
.hero h1 .grad{background:var(--thermal);-webkit-background-clip:text;background-clip:text;color:transparent}
.idea{background:var(--surface);border-inline-start:5px solid var(--mid);border-radius:4px 12px 12px 4px;padding:12px 16px;margin:0 0 16px}
.idea strong{color:var(--mid)}
.hero p.lead{color:var(--muted);margin:0 0 20px;max-width:58ch}
.hero-actions{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.progress-line{margin-top:18px;color:var(--muted);font-size:15px}
.credit-card{margin-top:20px;font-size:19px;color:var(--muted);line-height:1.6}
.credit-card b{color:var(--mid);font-weight:700}
.task-band{margin-top:-14px}
.tb-in{display:flex;align-items:center;gap:16px}
.tb-in .ti{flex:0 0 54px;height:54px;border-radius:14px;background:var(--thermal);display:grid;place-items:center;font-size:27px}
.task-tile{display:flex;align-items:center;gap:14px;margin-top:18px;background:var(--surface);border:2px solid var(--mid);border-radius:16px;padding:12px 18px 12px 14px;text-decoration:none;color:var(--ink);max-width:440px;transition:transform .15s}
.task-tile:hover{transform:translateY(-2px)}
.task-tile .ti{flex:0 0 54px;height:54px;border-radius:14px;background:var(--thermal);display:grid;place-items:center;font-size:27px}
.task-tile b{display:block;font-size:18px}
.task-tile small{color:var(--muted);font-size:14px}

.beaker-card{background:var(--surface);border:1px solid var(--line);border-radius:22px;padding:16px;position:relative}
.beaker-card canvas{display:block;width:100%;height:330px;touch-action:none;cursor:ew-resize;border-radius:14px;background:var(--surface2)}
.beaker-read{display:flex;justify-content:space-between;align-items:center;margin-top:10px;gap:10px;flex-wrap:wrap}
.temp-big{font-size:30px;font-weight:700;direction:ltr}
.phase-tag{padding:3px 12px;border-radius:999px;font-weight:600;font-size:15px;background:var(--chip)}
.beaker-card input[type=range]{width:100%;margin-top:8px}
.hint{font-size:14px;color:var(--muted);margin:6px 0 0}

/* path */
h2.sec{font-size:clamp(1.35rem,2.6vw,1.8rem);margin:8px 0 6px}
.sec-sub{color:var(--muted);margin:0 0 20px}
.thermo-track{position:relative;height:14px;border-radius:999px;background:var(--thermal);margin:22px 0 0}
.thermo-track .bulb{position:absolute;inset-inline-start:-8px;top:50%;transform:translateY(-50%);width:28px;height:28px;border-radius:50%;background:var(--cold)}
.lessons{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:16px;margin-top:-7px}
.lcard{position:relative;background:var(--surface);border:1px solid var(--line);border-radius:0 0 16px 16px;padding:26px 18px 18px;display:flex;flex-direction:column;gap:8px}
.lcard .node{position:absolute;top:-8px;inset-inline-start:18px;width:30px;height:30px;border-radius:50%;background:var(--surface);border:4px solid var(--c);display:grid;place-items:center;font-size:13px;font-weight:700;color:var(--c)}
.lcard.done .node{background:var(--c);color:#fff}
.lcode{font-size:34px;font-weight:700;color:var(--c);line-height:1;direction:ltr;text-align:right}
.lcard h3{margin:2px 0 0;font-size:19px;line-height:1.4}
.lcard p{margin:0;color:var(--muted);font-size:15px;line-height:1.6;flex:1}
.lmeta{display:flex;justify-content:space-between;align-items:center;font-size:14px;color:var(--muted)}
.lmeta .st{color:var(--amber);font-weight:600}

.badges{display:flex;flex-wrap:wrap;gap:14px;margin:8px 0 0}
.badge{display:flex;align-items:center;gap:10px;background:var(--surface);border:1px dashed var(--line);border-radius:999px;padding:6px 16px 6px 8px;color:var(--muted);font-size:15px}
.badge i{font-style:normal;width:34px;height:34px;border-radius:50%;display:grid;place-items:center;background:var(--chip);filter:grayscale(1);opacity:.6;font-size:18px}
.badge.on{border-style:solid;color:var(--ink);font-weight:600}
.badge.on i{filter:none;opacity:1;background:var(--thermal)}

.final-band{margin:36px 0;background:var(--surface);border:1px solid var(--line);border-radius:20px;padding:24px;display:grid;grid-template-columns:1fr auto;gap:18px;align-items:center;position:relative;overflow:hidden}
.final-band::before{content:"";position:absolute;inset-block:0;inset-inline-start:0;width:6px;background:var(--thermal)}
.final-band h3{margin:0 0 4px;font-size:22px}
.final-band p{margin:0;color:var(--muted)}

footer.foot{border-top:1px solid var(--line);margin-top:40px;padding:22px 0 30px;color:var(--muted);font-size:14px;text-align:center;line-height:1.7}
footer.foot b{color:var(--ink)}

/* lesson page */
.crumbs{margin:6px 0 10px}
.crumbs a{text-decoration:none;font-size:15px}
.lhead{display:grid;grid-template-columns:auto 1fr;gap:24px;align-items:end;padding:10px 0 22px;border-bottom:1px solid var(--line)}
.lnum{font-size:clamp(4rem,11vw,7.5rem);font-weight:700;line-height:.9;direction:ltr;background:var(--thermal);-webkit-background-clip:text;background-clip:text;color:transparent}
.lhead h1{margin:0;font-size:clamp(1.7rem,3.6vw,2.4rem);line-height:1.3}
.lhead .en{color:var(--muted);direction:ltr;text-align:right;font-size:16px}
.vocab{display:flex;flex-wrap:wrap;gap:8px;margin:12px 0 0}
.vocab span{background:var(--chip);border-radius:6px;padding:2px 10px;font-size:14px}

.lgrid{display:grid;grid-template-columns:300px 1fr;gap:28px;margin-top:24px;align-items:start}
.side{position:sticky;top:12px;display:flex;flex-direction:column;gap:16px}
.box{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:16px 18px}
.box h4{margin:0 0 8px;font-size:16px}
.tasks{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:8px}
.tasks li{display:flex;gap:10px;align-items:flex-start;font-size:15px;line-height:1.5;color:var(--muted)}
.tasks li .ck{flex:0 0 22px;height:22px;border-radius:6px;border:2px solid var(--line);display:grid;place-items:center;font-size:13px;margin-top:1px}
.tasks li.on{color:var(--ink)}
.tasks li.on .ck{background:var(--ok);border-color:var(--ok);color:#fff}
.tbar{height:8px;border-radius:99px;background:var(--chip);overflow:hidden;margin-top:12px}
.tbar i{display:block;height:100%;background:var(--thermal);width:0;transition:width .4s}
.side nav{display:flex;flex-direction:column;gap:2px}
.side nav a{text-decoration:none;color:var(--muted);font-size:15px;padding:4px 8px;border-radius:6px}
.side nav a:hover{background:var(--chip);color:var(--ink)}

.learn ul{margin:0;padding-inline-start:20px}
.learn li{margin:0 0 8px}
.main-col{display:flex;flex-direction:column;gap:26px;min-width:0}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:22px;min-width:0}
.panel.sim{border-top:4px solid var(--c,var(--cold))}
.panel h3{margin:0 0 4px;font-size:21px;line-height:1.4}
.panel .tag{display:inline-block;font-size:13px;font-weight:600;color:var(--c,var(--cold));margin-bottom:4px}
.panel .desc{color:var(--muted);margin:0 0 16px;font-size:15.5px}
.row{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.ctrl{display:flex;flex-direction:column;gap:4px;font-size:15px;color:var(--muted);flex:1;min-width:180px}
input[type=range]{accent-color:var(--mid);width:100%}
input[type=number],input[type=text],input.ans,select{font:inherit;font-size:16px;padding:8px 10px;border-radius:8px;border:1.5px solid var(--line);background:var(--surface2);color:var(--ink);min-width:0}
input.ans{width:150px;direction:ltr;text-align:center}
.unit{color:var(--muted);font-size:15px}

.prac{background:var(--surface2);border:1px solid var(--line);border-radius:12px;padding:14px 16px;margin-top:14px}
.prac p.q{margin:0 0 10px;font-size:16px}
.prac .fb{margin:8px 0 0;font-size:15px;min-height:1.2em}
.fb.ok{color:var(--ok)} .fb.bad{color:var(--bad)}
.prac.solved{border-color:var(--ok);background:var(--ok-soft)}

/* skier */
.bars{display:grid;gap:8px;margin-top:12px}
.bar{display:grid;grid-template-columns:120px 1fr 50px;gap:10px;align-items:center;font-size:14.5px}
.bar .tr{height:16px;background:var(--chip);border-radius:99px;overflow:hidden}
.bar .tr i{display:block;height:100%;border-radius:99px;transition:width .08s}
.bar b{direction:ltr;text-align:left;font-weight:600}
.switch{display:inline-flex;align-items:center;gap:8px;cursor:pointer;font-size:15px}

/* chips */
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{border:1.5px solid var(--line);background:var(--surface2);border-radius:999px;padding:5px 14px;cursor:pointer;font-size:14.5px}
.chip[aria-pressed=true]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.thermos{display:grid;grid-template-columns:repeat(auto-fit,minmax(78px,1fr));gap:12px;margin-top:16px;align-items:end}
.thermo{display:flex;flex-direction:column;align-items:center;gap:6px;font-size:13.5px;text-align:center}
.thermo .tube{width:22px;height:170px;border-radius:12px;background:var(--chip);position:relative;overflow:hidden;border:2px solid var(--line)}
.thermo .tube i{position:absolute;bottom:0;inset-inline:0;background:linear-gradient(to top,var(--cold),var(--hot));transition:height .25s}
.thermo b{direction:ltr;font-size:14px}

/* options quiz */
.opts{display:grid;gap:8px;margin-top:10px}
.opt{text-align:start;border:1.5px solid var(--line);background:var(--surface2);border-radius:10px;padding:10px 14px;cursor:pointer;font-size:16px;line-height:1.5}
.opt:hover:not([disabled]){border-color:var(--mid)}
.opt.ok{background:var(--ok-soft);border-color:var(--ok)}
.opt.bad{background:var(--bad-soft);border-color:var(--bad)}
.opt[disabled]{cursor:default}

/* calorimeter */
.calo{display:grid;grid-template-columns:220px 1fr;gap:20px;align-items:start}
.calo svg{width:100%;height:auto}
.dtable{width:100%;border-collapse:collapse;font-size:15px}
.dtable td{padding:6px 8px;border-bottom:1px solid var(--line)}
.dtable td:last-child{direction:ltr;text-align:left;font-weight:600}
.ctable{width:100%;border-collapse:collapse;font-size:14px;margin-top:6px}
.ctable th,.ctable td{padding:5px 8px;border-bottom:1px solid var(--line);text-align:start}
.ctable td.n{direction:ltr;text-align:left}

/* packs */
.packs{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:14px}
.ediag{display:grid;grid-template-columns:1fr 150px;gap:16px;align-items:stretch;background:var(--surface2);border-radius:12px;padding:16px}
.levels{position:relative;min-height:220px;border-inline-start:2px solid var(--muted);padding-inline-start:12px}
.levels .axis{position:absolute;inset-inline-start:-28px;top:50%;transform:translateY(-50%) rotate(-90deg);font-size:13px;color:var(--muted);white-space:nowrap}
.lv{position:absolute;inset-inline:12px;border-top:2px dashed var(--muted);font-size:15px;padding-top:2px}
.lv span{background:var(--chip);padding:1px 8px;border-radius:6px}
.lv.top{top:20px}.lv.bot{top:170px}
.arrowv{position:absolute;inset-inline-end:30%;top:30px;height:140px;width:4px;border-radius:4px}
.arrowv::after{content:"";position:absolute;inset-inline-start:-7px;border:9px solid transparent}
.arrowv.down{background:var(--hot)} .arrowv.down::after{bottom:-14px;border-top-color:var(--hot)}
.arrowv.up{background:var(--cold)} .arrowv.up::after{top:-14px;border-bottom-color:var(--cold)}
.dhlabel{position:absolute;inset-inline-end:calc(30% + 14px);top:84px;font-weight:700;direction:ltr}
.flow{display:flex;flex-direction:column;justify-content:center;align-items:center;gap:8px;text-align:center;font-size:14.5px;border-radius:10px;padding:10px}
.flow .big{font-size:30px}

/* heating curve */
.hc canvas{width:100%;height:300px;display:block;background:var(--surface2);border-radius:12px}
.seglist{display:grid;gap:6px;margin-top:12px}
.seg{display:grid;grid-template-columns:24px 1fr auto;gap:10px;align-items:center;padding:6px 10px;border-radius:8px;font-size:14.5px;border:1px solid transparent}
.seg.on{border-color:var(--mid);background:var(--chip)}
.seg .dot{width:12px;height:12px;border-radius:50%}
.seg b{direction:ltr}

/* hess */
.tabs{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:14px}
.tab{border:1.5px solid var(--line);background:var(--surface2);border-radius:8px;padding:6px 14px;cursor:pointer;font-size:15px}
.tab[aria-selected=true]{background:var(--mid);color:#fff;border-color:var(--mid)}
.tab.solved::after{content:" ✓"}
.target{background:var(--surface2);border:1.5px dashed var(--mid);border-radius:12px;padding:12px 14px;margin-bottom:12px;font-size:17px;overflow-x:auto}
.hcard{display:grid;grid-template-columns:1fr auto;gap:10px;align-items:center;border:1px solid var(--line);border-radius:12px;padding:10px 12px;margin-bottom:8px;background:var(--surface)}
.hcard .eq{font-size:16.5px;overflow-x:auto;padding-bottom:2px}
.hcard .dh{direction:ltr;font-weight:600;font-size:14.5px;color:var(--muted)}
.hcard .tools{display:flex;gap:6px;flex-wrap:wrap}
.sum{border-top:2px solid var(--ink);margin-top:8px;padding-top:10px;font-size:17px;overflow-x:auto}
.status{margin-top:10px;padding:10px 14px;border-radius:10px;font-weight:600}
.status.ok{background:var(--ok-soft);color:var(--ok)}
.status.wait{background:var(--chip);color:var(--muted)}

/* ladder */
.ladwrap{display:grid;grid-template-columns:1fr 1fr;gap:20px}
.ladder{position:relative;height:440px;background:var(--surface2);border-radius:12px}
.ladder .ax{position:absolute;top:12px;bottom:12px;inset-inline-start:50%;width:3px;background:var(--thermal);transform:translateX(50%)}
.lpt{position:absolute;transform:translateY(-50%);display:flex;align-items:center;gap:6px;cursor:pointer;border:0;background:transparent;padding:0;font-size:14px}
.lpt .ln{width:34px;height:2px;background:var(--muted)}
.lpt span{background:var(--surface);border:1px solid var(--line);border-radius:6px;padding:1px 8px;direction:ltr;white-space:nowrap}
.lpt.r{inset-inline-start:calc(50% + 2px)}
.lpt.l{inset-inline-end:calc(50% + 2px);flex-direction:row-reverse}
.lpt.zero span{background:var(--chip)}
.lpt:hover span,.lpt.sel span{border-color:var(--mid);box-shadow:0 0 0 2px var(--mid)}

/* games */
.game .gbox{background:var(--surface2);border-radius:14px;padding:20px;text-align:center;min-height:230px;display:flex;flex-direction:column;justify-content:center;align-items:center;gap:12px}
.ghead{display:flex;justify-content:space-between;width:100%;font-weight:600;font-size:15px}
.timer{direction:ltr}
.gprompt{font-size:20px;font-weight:600;line-height:1.5;max-width:46ch}
.gopts{display:flex;flex-wrap:wrap;gap:10px;justify-content:center}
.gopts .opt{min-width:120px;text-align:center}
.gscore{font-size:42px;font-weight:700;direction:ltr}
.flash-ok{animation:fo .35s}
.flash-bad{animation:fb .35s}
@keyframes fo{50%{background:var(--ok-soft)}}
@keyframes fb{50%{background:var(--bad-soft)}}
.stars3{font-size:28px;letter-spacing:4px;color:var(--amber)}

<script>
"use strict";
const $=(s,r=document)=>r.querySelector(s);
const $$=(s,r=document)=>Array.from(r.querySelectorAll(s));
const LS='hydro22-sabah-ch4-v1';
let S={tasks:{},games:{},quiz:{},done:{},final:null,theme:null};
try{const raw=localStorage.getItem(LS);if(raw)S=Object.assign(S,JSON.parse(raw));}catch(e){}
function save(){try{localStorage.setItem(LS,JSON.stringify(S));}catch(e){}try{autoSync();}catch(e){}}
const reduced=window.matchMedia('(prefers-reduced-motion: reduce)').matches;
let cleanups=[];
function onCleanup(fn){cleanups.push(fn);}

/* ---------- helpers ---------- */
function fm(s){return String(s).replace(/([A-Za-z\)])(\d+)/g,'$1<sub>$2</sub>').replace(/\((s|l|g|aq)\)/g,'<sub>($1)</sub>');}
function fmo(t){return String(t).trim().startsWith('<')?t:fm(t);}
function fmAll(root){$$('.f',root).forEach(e=>{if(!e.dataset.fm){e.innerHTML=fm(e.textContent);e.dataset.fm='1';e.setAttribute('dir','ltr');}});}
function shuffle(a){a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;}
function parseNum(s){
  s=String(s).trim().replace(/[٠-٩]/g,d=>'٠١٢٣٤٥٦٧٨٩'.indexOf(d)).replace(/[٫]/g,'.').replace(/[,،\s]/g,'').replace(/[−–]/g,'-');
  const m=s.match(/^([+-]?\d*\.?\d+)[×xX\*]10\^?([+-]?\d+)$/);
  if(m)return parseFloat(m[1])*Math.pow(10,+m[2]);
  if(s==='')return NaN; const v=Number(s); return isFinite(v)?v:NaN;
}
const SUP={'-':'⁻','0':'⁰','1':'¹','2':'²','3':'³','4':'⁴','5':'⁵','6':'⁶','7':'⁷','8':'⁸','9':'⁹'};
function nice(x,p=3){
  if(!isFinite(x))return '—';
  const a=Math.abs(x);
  if(a!==0&&(a>=1e5||a<1e-3)){const e=Math.floor(Math.log10(a));const m=x/Math.pow(10,e);return (+m.toFixed(p-1))+' × 10'+String(e).split('').map(c=>SUP[c]).join('');}
  return String(+x.toPrecision(Math.max(p,String(Math.round(a)).length)));

/* ---------- hydrocarbon engine (names & drawings) ---------- */
const STEM=['','ميث','إيث','بروب','بيوت','بنت','هكس','هبت','أوكت','نون','ديك'];
const MULT=['','','ثنائي ','ثلاثي ','رباعي '];
const SUBN={e:'إيثيل',m:'ميثيل'};
function parentName(n,bond,cyc){const st=STEM[n];if(cyc)return st+'ان حلقي';if(!bond)return st+'ان';const suf=bond.o===2?'ين':'اين';return (n>=4?bond.p+'-':'')+st+suf;}
function lexLess(a,b){for(let i=0;i<Math.min(a.length,b.length);i++){if(a[i]!==b[i])return a[i]<b[i];}return false;}
function chainName(n,subs=[],bond=null){
  const opt=rev=>{const P=p=>rev?n+1-p:p;const s=subs.map(x=>({p:P(x.p),t:x.t}));const b=bond?{p:rev?n-bond.p:bond.p,o:bond.o}:null;return{s,b};};
  const A=opt(false),B=opt(true);let pick=A;
  const key=o=>[o.b?o.b.p:0].concat(o.s.map(x=>x.p).sort((a,b)=>a-b));
  const kA=key(A),kB=key(B);
  if(lexLess(kB,kA))pick=B;else if(!lexLess(kA,kB)){const eA=A.s.filter(x=>x.t==='e').map(x=>x.p).sort((a,b)=>a-b),eB=B.s.filter(x=>x.t==='e').map(x=>x.p).sort((a,b)=>a-b);if(lexLess(eB,eA))pick=B;}
  const parts=['e','m'].map(t=>{const ps=pick.s.filter(x=>x.t===t).map(x=>x.p).sort((a,b)=>a-b);return ps.length?ps.join(',')+'-'+MULT[ps.length]+SUBN[t]:'';}).filter(Boolean);
  const par=parentName(n,pick.b);return parts.length?parts.join('-')+(/^\d/.test(par)?'-':' ')+par:par;
}
function svgLabel(t,x,y,size=15,anchor='middle'){let out='';for(const m of t.matchAll(/([A-Za-z]+)|(\d+)|([^A-Za-z\d]+)/g)){if(m[2])out+=`<tspan font-size="${size*0.68}" dy="4">${m[2]}</tspan><tspan dy="-4"></tspan>`;else out+=(m[1]||m[3]).replace(/&/g,'&amp;');}return `<text x="${x}" y="${y}" text-anchor="${anchor}" font-size="${size}" font-weight="600" fill="currentColor" direction="ltr">${out}</text>`;}
function hLab(h){return h===0?'C':h===1?'CH':'CH'+h;}
function drawChain(n,subs=[],bond=null,opt={}){
  const dx=opt.dx||72,W=Math.max(220,(n-1)*dx+90),x0=45,yM=95;const ord=i=>bond&&bond.p===i?bond.o:1;
  const cnt=Array(n+1).fill(0);subs.forEach(s=>cnt[s.p]++);
  let s=`<svg viewBox="0 0 ${W} 190" class="mol" role="img" aria-label="صيغة بنائية">`;
  for(let i=1;i<n;i++){const xa=x0+(i-1)*dx+22,xb=x0+i*dx-22,o=ord(i);[...Array(o)].forEach((_,k)=>{const off=(k-(o-1)/2)*6;s+=`<line x1="${xa}" y1="${yM-5+off}" x2="${xb}" y2="${yM-5+off}" stroke="currentColor" stroke-width="2"/>`;});}
  const used={};
  for(let i=1;i<=n;i++){const nb=(i>1?ord(i-1):0)+(i<n?ord(i):0);const h=4-nb-cnt[i];s+=svgLabel(hLab(h),x0+(i-1)*dx,yM);}
  subs.forEach(sb=>{const k=used[sb.p]=(used[sb.p]||0)+1;const up=k===1;const x=x0+(sb.p-1)*dx;const y1=up?yM-20:yM+6,y2=up?yM-44:yM+30;
    s+=`<line x1="${x}" y1="${y1}" x2="${x}" y2="${y2}" stroke="currentColor" stroke-width="2"/>`;
    if(sb.t==='m')s+=svgLabel('CH3',x,up?y2-6:y2+18);
    else{s+=svgLabel('CH2',x,up?y2-6:y2+18);const y3=up?y2-22:y2+24,y4=up?y2-42:y2+44;s+=`<line x1="${x}" y1="${y3}" x2="${x}" y2="${y4}" stroke="currentColor" stroke-width="2"/>`+svgLabel('CH3',x,up?y4-6:y4+18);}});
  let top=70,bot=110;Object.keys(used).forEach(p=>{const list=subs.filter(x=>x.p==+p);list.forEach((x,k)=>{if(k===0)top=Math.min(top,x.t==='e'?-30:28);else bot=Math.max(bot,x.t==='e'?222:152);});});

function molFormula(n,bond,cyc){const h=cyc?2*n:!bond?2*n+2:bond.o===2?2*n:2*n-2;return `C${n>1?n:''}H${h}`;}
/* benzene ring */
function ringName(subs){if(!subs.length)return 'بنزين';if(subs.length===1)return SUBN[subs[0].t]+' بنزين';
  let best=null;for(let st=0;st<6;st++)for(const dir of[1,-1]){const s=subs.map(x=>({p:((dir*(x.p-st))%6+6)%6+1,t:x.t}));const key=s.map(x=>x.p).sort((a,b)=>a-b);const eK=s.filter(x=>x.t==='e').map(x=>x.p).sort((a,b)=>a-b);
    if(!best||lexLess(key,best.key)||(!lexLess(best.key,key)&&lexLess(eK,best.eK)))best={s,key,eK};}
  const parts=['e','m'].map(t=>{const ps=best.s.filter(x=>x.t===t).map(x=>x.p).sort((a,b)=>a-b);return ps.length?ps.join(',')+'-'+MULT[ps.length]+SUBN[t]:'';}).filter(Boolean);return parts.join('-')+' بنزين';}
function drawRing(subs=[],mode='circle',sz=1){const cx=120,cy=110,R=48;const P=k=>[cx+R*Math.sin(k*Math.PI/3),cy-R*Math.cos(k*Math.PI/3)];
  let s=`<svg viewBox="0 0 240 220" class="mol" role="img" aria-label="حلقة بنزين">`;
  for(let k=0;k<6;k++){const a=P(k),b=P(k+1);s+=`<line x1="${a[0]}" y1="${a[1]}" x2="${b[0]}" y2="${b[1]}" stroke="currentColor" stroke-width="2.5"/>`;
    if(mode!=='circle'&&((k%2===0)===(mode==='A'))){const ia=[cx+(a[0]-cx)*0.78,cy+(a[1]-cy)*0.78],ib=[cx+(b[0]-cx)*0.78,cy+(b[1]-cy)*0.78];s+=`<line x1="${ia[0]}" y1="${ia[1]}" x2="${ib[0]}" y2="${ib[1]}" stroke="currentColor" stroke-width="2.5"/>`;}}
  if(mode==='circle')s+=`<circle cx="${cx}" cy="${cy}" r="${R*0.6}" fill="none" stroke="currentColor" stroke-width="2.5"/>`;
  subs.forEach(x=>{const k=x.p-1,a=P(k),o=[cx+(a[0]-cx)*1.45,cy+(a[1]-cy)*1.45];s+=`<line x1="${a[0]}" y1="${a[1]}" x2="${cx+(a[0]-cx)*1.25}" y2="${cy+(a[1]-cy)*1.25}" stroke="currentColor" stroke-width="2"/>`+svgLabel(x.t==='m'?'CH3':'C2H5',o[0],o[1]+5,14);});
  return s+'</svg>';}
const MOL=(svg)=>`<div class="molbox">${svg}</div>`;
/* cyclic structures with substituents */
function cycSub(n,subs=[],dbls=[],opt={}){const cx=110,cy=100,R=n===3?48:n===4?44:48,off=n===4?-135:-90;const V=[...Array(n)].map((_,k)=>{const a=(off+k*360/n)*Math.PI/180;return[cx+R*Math.cos(a),cy+R*Math.sin(a)];});
  let s=`<svg viewBox="0 0 220 200" class="mol" role="img" aria-label="مركب حلقي"><polygon points="${V.map(v=>v.join(',')).join(' ')}" fill="none" stroke="currentColor" stroke-width="2.5"/>`;
  dbls.forEach(([i,j])=>{const a=V[i],b=V[j],ia=[cx+(a[0]-cx)*0.8,cy+(a[1]-cy)*0.8],ib=[cx+(b[0]-cx)*0.8,cy+(b[1]-cy)*0.8];s+=`<line x1="${ia[0]}" y1="${ia[1]}" x2="${ib[0]}" y2="${ib[1]}" stroke="currentColor" stroke-width="2.5"/>`;});
  if(opt.circle)s+=`<circle cx="${cx}" cy="${cy}" r="${R*0.58}" fill="none" stroke="currentColor" stroke-width="2.3"/>`;
  subs.forEach(([k,l])=>{const a=V[k],e=[cx+(a[0]-cx)*1.3,cy+(a[1]-cy)*1.3],o=[cx+(a[0]-cx)*1.62,cy+(a[1]-cy)*1.62];s+=`<line x1="${a[0]}" y1="${a[1]}" x2="${e[0]}" y2="${e[1]}" stroke="currentColor" stroke-width="2"/>`+svgLabel(l,o[0],o[1]+5,13);});
  return s+'</svg>';}

/* ---------- views ---------- */
const app=$('#app');
function route(){
  cleanups.forEach(f=>{try{f();}catch(e){}});cleanups=[];
  const h=location.hash.replace('#','');
  if(new RegExp('^lesson-[1-'+LESSONS.length+']$').test(h))viewLesson(+h.slice(7));
  else if(h==='final')viewFinal();
  else viewHome();
  fmAll(app);refreshStars();window.scrollTo(0,0);
}
window.addEventListener('hashchange',route);

function badgeHTML(){return '<div class="badges">'+BADGES.map(b=>{const on=b[0]==='final'?(S.final!=null&&S.final>=80):S.done[b[0].slice(1)];return `<div class="badge ${on?'on':''}"><i>${b[1]}</i>${b[2]}</div>`;}).join('')+'</div>';}
function lessonStars(L){let n=L.tasks.filter(t=>S.tasks[t.id]).length;n+=gameStars(S.games[L.game]||0);if((S.quiz[L.n]||0)>=PASS(L.n))n+=3;return n;}
function lessonMax(L){return L.tasks.length+3+3;}

/* ---------- مزامنة التقدم التلقائية مع Cloudflare D1 ---------- */
let _syncT=null;
const QUEUE_KEY='chem22-pending-sync-v1';
function getPendingSync(){try{return JSON.parse(localStorage.getItem(QUEUE_KEY)||'{}');}catch(e){return {};}}
function setPendingSync(q){try{localStorage.setItem(QUEUE_KEY,JSON.stringify(q));}catch(e){}}

async function syncProgress(manual){
  const p=window.Chem22Student&&Chem22Student.get();if(!p)return false;
  const list=LESSONS.filter(L=>S.done[L.n]).map(L=>L.n),max=LESSONS.reduce((a,L)=>a+lessonMax(L),0)+5;
  const payload={name:p.name,grade:p.grade,section:p.section,chapter:CH_NO,done:list.length,done_list:list,total:LESSONS.length,final:S.final==null?null:S.final,stars:totalStars(),max};
  try{
    const r=await fetch('/api/progress',{method:'POST',headers:{"Content-Type":"application/json"},body:JSON.stringify(payload)});
    if(!r.ok)throw new Error('status '+r.status);
    const q=getPendingSync();if(q[CH_NO]){delete q[CH_NO];setPendingSync(q);}
    const stEl=$('#syncStatus');if(stEl){stEl.className='fb ok';stEl.textContent='✓ حُفظ تقدمك تلقائيًا في السحابة';}
    if(manual)toast('✓ حُفظ تقدمك في السحابة');
    return true;
  }catch(e){
    const q=getPendingSync();q[CH_NO]=payload;setPendingSync(q);

function bindPrac(root){
  $$('.prac[data-ans]',root).forEach(p=>{
    const inp=$('input',p),btn=$('button',p),fb=$('.fb',p);
    if(p.dataset.task&&S.tasks[p.dataset.task])p.classList.add('solved');

}

/* ---------- 3D molecule viewer ---------- */
const GEO=(()=>{const g={};
  g.methane={name:'الميثان',f:'CH4',atoms:[['C',0,0,0],['H',.63,.63,.63],['H',.63,-.63,-.63],['H',-.63,.63,-.63],['H',-.63,-.63,.63]],bonds:[[0,1,1],[0,2,1],[0,3,1],[0,4,1]]};
  const eth=[['C',-.77,0,0],['C',.77,0,0]];const eb=[[0,1,1]];[0,120,240].forEach(a=>{const r=a*Math.PI/180;eth.push(['H',-1.13,1.03*Math.cos(r),1.03*Math.sin(r)]);eb.push([0,eth.length-1,1]);});[60,180,300].forEach(a=>{const r=a*Math.PI/180;eth.push(['H',1.13,1.03*Math.cos(r),1.03*Math.sin(r)]);eb.push([1,eth.length-1,1]);});
  g.ethane={name:'الإيثان',f:'C2H6',atoms:eth,bonds:eb};
  g.ethene={name:'الإيثين (الإيثيلين)',f:'C2H4',atoms:[['C',-.67,0,0],['C',.67,0,0],['H',-1.24,.93,0],['H',-1.24,-.93,0],['H',1.24,.93,0],['H',1.24,-.93,0]],bonds:[[0,1,2],[0,2,1],[0,3,1],[1,4,1],[1,5,1]]};
  g.ethyne={name:'الإيثاين (الأسيتيلين)',f:'C2H2',atoms:[['C',-.6,0,0],['C',.6,0,0],['H',-1.66,0,0],['H',1.66,0,0]],bonds:[[0,1,3],[0,2,1],[1,3,1]]};
  const bz=[],bb=[];for(let k=0;k<6;k++){const a=k*Math.PI/3;bz.push(['C',1.39*Math.cos(a),1.39*Math.sin(a),0]);}for(let k=0;k<6;k++){const a=k*Math.PI/3;bz.push(['H',2.47*Math.cos(a),2.47*Math.sin(a),0]);bb.push([k,(k+1)%6,k%2?1:2]);bb.push([k,k+6,1]);}
  g.benzene={name:'البنزين',f:'C6H6',atoms:bz,bonds:bb,size:6.4};return g;})();
function MolViewer(cv,opt={}){const ctx=cv.getContext('2d');let W=0,H=0,a=0.6,b=0.35,mol='methane',mode='ball',drag=false,sx=0,sy=0,raf=0,last=performance.now(),idle=0;
  const fit=()=>{const r=cv.getBoundingClientRect(),d=window.devicePixelRatio||1;W=r.width;H=r.height;cv.width=W*d;cv.height=H*d;ctx.setTransform(d,0,0,d,0,0);};fit();const ro=new ResizeObserver(fit);ro.observe(cv);
  cv.addEventListener('pointerdown',e=>{drag=true;sx=e.clientX;sy=e.clientY;cv.setPointerCapture(e.pointerId);});
  cv.addEventListener('pointermove',e=>{if(!drag)return;a+=(e.clientX-sx)*0.01;b+=(e.clientY-sy)*0.01;sx=e.clientX;sy=e.clientY;idle=0;opt.onRotate&&opt.onRotate();});
  cv.addEventListener('pointerup',()=>drag=false);
  const draw=()=>{const g=GEO[mol],s=Math.min(W,H)/(g.size||5.2);ctx.clearRect(0,0,W,H);
    const P=g.atoms.map(([e,x,y,z])=>{const x1=x*Math.cos(a)+z*Math.sin(a),z1=-x*Math.sin(a)+z*Math.cos(a),y1=y*Math.cos(b)-z1*Math.sin(b),z2=y*Math.sin(b)+z1*Math.cos(b);const k=1+z2*0.06;return{e,X:W/2+x1*s*k,Y:H/2-y1*s*k,z:z2,k};});
    const col=e=>e==='C'?['#4a5263','#20242d']:['#ffffff','#b9c0cc'];
    if(mode==='ball'){const items=[];g.bonds.forEach(([i,j,o])=>items.push({z:(P[i].z+P[j].z)/2-0.01,f:()=>{const A=P[i],B=P[j],dx=B.X-A.X,dy=B.Y-A.Y,L=Math.hypot(dx,dy)||1,nx=-dy/L,ny=dx/L;for(let q=0;q<o;q++){const off=(q-(o-1)/2)*7;ctx.strokeStyle='#8b93a3';ctx.lineWidth=4;ctx.beginPath();ctx.moveTo(A.X+nx*off,A.Y+ny*off);ctx.lineTo(B.X+nx*off,B.Y+ny*off);ctx.stroke();}}}));
      P.forEach(p=>items.push({z:p.z,f:()=>{const r=(p.e==='C'?0.33:0.22)*s*p.k;const [c1,c2]=col(p.e);const gr=ctx.createRadialGradient(p.X-r/3,p.Y-r/3,r/5,p.X,p.Y,r);gr.addColorStop(0,c1);gr.addColorStop(1,c2);ctx.fillStyle=gr;ctx.beginPath();ctx.arc(p.X,p.Y,r,0,7);ctx.fill();}}));
      items.sort((x,y)=>x.z-y.z).forEach(it=>it.f());}
    else{P.slice().sort((x,y)=>x.z-y.z).forEach(p=>{const r=(p.e==='C'?0.85:0.6)*s*p.k;const [c1,c2]=col(p.e);const gr=ctx.createRadialGradient(p.X-r/3,p.Y-r/3,r/5,p.X,p.Y,r);gr.addColorStop(0,c1);gr.addColorStop(1,c2);ctx.fillStyle=gr;ctx.beginPath();ctx.arc(p.X,p.Y,r,0,7);ctx.fill();});}};
  const loop=t=>{const dt=(t-last)/1000;last=t;idle+=dt;if(!drag&&idle>1.5&&!reduced)a+=dt*0.5;draw();raf=requestAnimationFrame(loop);};raf=requestAnimationFrame(loop);
  onCleanup(()=>{cancelAnimationFrame(raf);ro.disconnect();});
  return{set(m){mol=m;},mode(m){mode=m;}};}

function initBeaker(){const cv=$('#beaker');if(!cv)return;const V=MolViewer(cv);

 bzHistory:{html:()=>`<h4>📜 خط زمني تفاعلي: كيف توصل العلماء إلى صيغة البنزين؟</h4>
  <div class="tl" id="bhT">${[['1825','فاراداي'],['1860','صيغ مقترحة'],['1865','كيكولي'],['1930','باولينج']].map((x,i)=>`<button type="button" class="tlb" data-i="${i}" aria-pressed="${i===0}"><b class="ltr">${x[0]}</b><span>${x[1]}</span></button>`).join('')}</div>

  init(root){const S=[
   ['عزل المادة','عزل الفيزيائي البريطاني مايكل فاراداي البنزين من الغازات المنبعثة عند تسخين زيوت الحيتان أو الفحم، وحدّد الكيميائيون صيغته الجزيئية <span class="f">C6H6</span>.','<div class="cmp"><div><span class="f">C6H14</span><small>الهكسان المشبع</small></div><div class="vs">مقابل</div><div><span class="f">C6H6</span><small>البنزين: ثماني ذرات هيدروجين أقل</small></div></div><p class="cm-note">النتيجة: البنزين غير مشبع، فلا بد أن فيه روابط ثنائية أو ثلاثية.</p>'],

   ['الحلقة السداسية','اقترح الكيميائي الألماني كيكولي حلقة سداسية مسطحة تتبادل فيها الروابط الأحادية والثنائية. وقال إنه رأى في المنام أفعى تعض ذيلها (شعار أوروبوروس)، فخطرت له فكرة الحلقة.',MOL(drawRing([],'A'))+'<p class="cm-note">✔️ فسّرت الحلقة الشكل السداسي، لكنها لم تفسّر ضعف نشاط البنزين: لو كانت فيه روابط ثنائية عادية لتفاعل كالألكينات.</p>'],
   ['الإلكترونات غير المتمركزة','طبّق لينوس باولينج نظرية المجالات المهجنة على البنزين، فوجد أن أزواج إلكترونات الروابط الثنائية لا تبقى بين ذرتي كربون محددتين، بل تتشارك فيها ذرات الكربون الست.',MOL(drawRing([],'circle'))+'<p class="cm-note">✔️ الإلكترونات المشتركة بين ست نوى يصعب سحبها، فيصبح البنزين ثابتًا كيميائيًا. لذلك نرسم دائرة داخل الحلقة.</p>']];

 deloc:{html:()=>`<h4>☁️ نشاط تفاعلي: ما معنى أن الإلكترونات غير متمركزة؟</h4>
  ${radioChips('dlM',[['loc','إلكترونات متمركزة (كما تخيّلها كيكولي)'],['deloc','إلكترونات غير متمركزة (الحقيقة)']])}
  <div class="dlgrid"><svg viewBox="0 0 300 280" id="dlS" role="img" aria-label="حركة إلكترونات حلقة البنزين"></svg><div class="lpinfo" id="dlI"></div></div>
  <div class="row" style="margin-top:8px"><button type="button" class="btn sm hot" id="dlPull">🧲 حاولي سحب زوج إلكترونات من الحلقة</button></div><p class="fb" id="dlF"></p>`,
  init(root){let raf=0,t=0,pull=0;const seen=new Set();const cx=150,cy=135,R=82;const P=k=>[cx+R*Math.sin(k*Math.PI/3),cy-R*Math.cos(k*Math.PI/3)];
   const draw=()=>{const m=chipVal(root,'dlM');t+=reduced?0:0.02;pull=Math.max(0,pull-0.01);let s='';
    if(m==='deloc'){s+=`<path d="M${cx} ${cy-R*1.05} a${R*1.05} ${R*1.05} 0 1 0 0.01 0 Z M${cx} ${cy-R*0.62} a${R*0.62} ${R*0.62} 0 1 1 -0.01 0 Z" fill="rgba(138,79,200,.22)" fill-rule="evenodd"/>`;}
    for(let k=0;k<6;k++){const a=P(k),b=P(k+1);s+=`<line x1="${a[0]}" y1="${a[1]}" x2="${b[0]}" y2="${b[1]}" stroke="currentColor" stroke-width="3"/>`;
      const mx=(a[0]+b[0])/2,my=(a[1]+b[1])/2,lx=cx+(mx-cx)*1.28,ly=cy+(my-cy)*1.28;s+=`<text x="${lx}" y="${ly+4}" text-anchor="middle" font-size="10.5" fill="currentColor" direction="ltr">${m==='deloc'?'139':(k%2===0?'134':'154')} pm</text>`;
      if(m==='loc'&&k%2===0){const ia=[cx+(a[0]-cx)*0.8,cy+(a[1]-cy)*0.8],ib=[cx+(b[0]-cx)*0.8,cy+(b[1]-cy)*0.8];s+=`<line x1="${ia[0]}" y1="${ia[1]}" x2="${ib[0]}" y2="${ib[1]}" stroke="currentColor" stroke-width="3"/>`;}}
    for(let k=0;k<6;k++){const a=P(k);s+=`<circle cx="${a[0]}" cy="${a[1]}" r="11" fill="#4a5263"/><text x="${a[0]}" y="${a[1]+4}" text-anchor="middle" font-size="10" fill="#fff" font-weight="700">C</text>`;}
    if(m==='loc'){for(let k=0;k<3;k++){const a=P(2*k),b=P(2*k+1);const f=0.5+0.18*Math.sin(t*3+k);const mx=a[0]+(b[0]-a[0])*f,my=a[1]+(b[1]-a[1])*f;const ox=(cx-mx)*0.14,oy=(cy-my)*0.14;const pz=k===0?pull*60:0;
      [[-4,0],[4,0]].forEach(([dx])=>{s+=`<circle cx="${mx+ox+dx*0.8-pz}" cy="${my+oy-pz*0.4}" r="5" fill="#2763D8" stroke="#fff"/>`;});}}
    else{for(let k=0;k<6;k++){const ang=t*1.6+k*Math.PI/3,r=R*0.84+Math.sin(t*4+k)*3;s+=`<circle cx="${cx+r*Math.sin(ang)}" cy="${cy-r*Math.cos(ang)}" r="5" fill="#2763D8" stroke="#fff"/>`;}}
    s+=`<text x="${cx}" y="272" text-anchor="middle" font-size="12" fill="currentColor">${m==='deloc'?'السحابة البنفسجية: الإلكترونات منتشرة فوق الحلقة كلها':'كل زوج محصور بين ذرتي كربون فقط'}</text>`;
    $('#dlS',root).innerHTML=s;raf=requestAnimationFrame(draw);};
   const info=()=>{const m=chipVal(root,'dlM');seen.add(m);if(seen.size===2)completeTask('l5-deloc');$('#dlF',root).textContent='';
    $('#dlI',root).innerHTML=m==='loc'?'<b>لو كانت الإلكترونات متمركزة:</b><br>• كل زوج من إلكترونات الروابط الثنائية يبقى بين ذرتين فقط.<br>• تكون الروابط مختلفة الطول: ثنائية قصيرة (<span class="ltr">134 pm</span>) وأحادية طويلة (<span class="ltr">154 pm</span>).<br>• يسهل سحب الزوج، فيتفاعل الجزيء بسهولة كالألكينات.':'<b>الحقيقة: الإلكترونات غير متمركزة</b><br>• الإلكترونات الستة تتحرك فوق الحلقة كلها ولا تخص رابطة معينة.<br>• الروابط الست متساوية الطول (<span class="ltr">139 pm</span>)، بين الأحادية والثنائية.<br>• الإلكترونات مشتركة بين ست نوى، فيصعب سحبها، لذلك البنزين ثابت.<br><small>تشبيه: كرة يتقاذفها ستة لاعبين في دائرة، لا لاعبان فقط، فيصعب على أحد خطفها.</small>';};
   bindChips(root,'dlM',info);info();
   $('#dlPull',root).addEventListener('click',()=>{const m=chipVal(root,'dlM'),f=$('#dlF',root);if(m==='loc'){pull=1;f.className='fb bad';f.textContent='انسحب الزوج بسهولة لأنه يخص ذرتين فقط، وهذا ما يحدث في الألكينات النشطة.';}else{f.className='fb ok';f.textContent='صعب جدًا! الإلكترونات مشتركة بين ست نوى كربون، فهي مثبتة جيدًا، ولذلك البنزين غير نشط كيميائيًا.';}});
   draw();onCleanup(()=>cancelAnimationFrame(raf));}},

    $('#mdI',root).innerHTML=`<b>${g.name}</b><br>الصيغة الجزيئية: <span class="f">${g.f}</span><br>الصيغة البنائية:${MOL(drawChain(n,[],bd))}${m==='ethane'||m==='methane'?'مشبع: روابط أحادية فقط':'غير مشبع: '+(m==='ethene'?'رابطة ثنائية':'رابطة ثلاثية')}`;fmAll(root);
    if(seen.size>=3&&sp)completeTask('l1-models');};
  bindChips(root,'mdM',up);bindChips(root,'mdV',up);up();

SIMS.distill={title:'برج التقطير التجزيئي',
html:()=>`<h3>🔬 برج التقطير التجزيئي</h3><p class="desc">اختاري عدد ذرات الكربون في جزيء من النفط الخام، ثم سخّني النفط وراقبي أين يتكثف الجزيء.</p>

init(root){const found=new Set();const yT=[40,85,130,175,220,262];
  const base=(hl,mx,my)=>`<rect x="110" y="20" width="110" height="250" rx="16" fill="var(--surface2)" stroke="currentColor" stroke-width="3"/>${yT.slice(0,5).map((y,i)=>`<line x1="110" y1="${y+22}" x2="220" y2="${y+22}" stroke="currentColor" opacity=".4"/><line x1="220" y1="${y+10}" x2="262" y2="${y+10}" stroke="currentColor" stroke-width="3"/><text x="268" y="${y+14}" font-size="11.5" fill="currentColor" font-weight="${hl===i?700:400}">${FR[i][2]}</text>`).join('')}<text x="268" y="282" font-size="11.5" fill="currentColor" font-weight="${hl===5?700:400}">${FR[5][2]}</text>
   <rect x="20" y="236" width="70" height="34" rx="6" fill="#DE4527" opacity=".85"/><text x="55" y="258" text-anchor="middle" font-size="12" fill="#fff">الفرن</text><line x1="90" y1="252" x2="110" y2="252" stroke="currentColor" stroke-width="3"/>
   <text x="165" y="14" text-anchor="middle" font-size="11" fill="currentColor">أبرد ↑</text><text x="165" y="292" text-anchor="middle" font-size="11" fill="currentColor">أسخن ↓</text>${mx!=null?`<circle cx="${mx}" cy="${my}" r="9" fill="#E3B23C" stroke="#8a6a10"/><text x="${mx}" y="${my+4}" text-anchor="middle" font-size="9" font-weight="700" direction="ltr">C${$('#dsN',root).value}</text>`:''}`;
  const fr=n=>FR.findIndex(f=>n>=f[0]&&n<=f[1]);
  const lab=()=>{$('#dsNv',root).textContent=$('#dsN',root).value;$('#dsS',root).innerHTML=base(-1,165,252);};
  $('#dsN',root).addEventListener('input',lab);lab();
  $('#dsGo',root).addEventListener('click',()=>{const n=+$('#dsN',root).value,i=fr(n),ty=i===5?262:yT[i]+10;$('#dsGo',root).disabled=true;
    tween(1500,k=>{$('#dsS',root).innerHTML=base(-1,165+(i===5?0:(240-165)*Math.max(0,k-0.75)*4),252+(ty-252)*Math.min(1,k/0.75));},()=>{$('#dsGo',root).disabled=false;$('#dsS',root).innerHTML=base(i,i===5?165:240,ty);
      const f=FR[i];$('#dsI',root).innerHTML=`<b>${f[2]}</b><br>عدد ذرات الكربون: <span class="ltr">C${f[0]} – C${f[1]}</span><br>مدى الغليان: <span class="ltr">${f[3]}</span><br>الاستعمال: ${f[4]}`;
      if(!found.has(i)){found.add(i);addRow($('#dsT',root),[f[2],`C${f[0]}–C${f[1]}`,f[3],f[4]]);}if(found.size>=5)completeTask('l1-dist');});});
  mcq(root,'#dsQ','لماذا تُجرى عملية التكسير الحراري في مصافي النفط؟',['لتحويل الجزيئات الكبيرة قليلة الطلب إلى جزيئات أصغر مثل مكونات البنزين','لفصل النفط حسب درجات الغليان','لزيادة طول السلاسل الكربونية','لإضافة الأكسجين إلى الوقود'],0,()=>completeTask('l1-crack'));}};

const BP=[null,-162,-89,-42,-0.5,36,69,98,126,151,174];
SIMS.series={title:'السلسلة المتماثلة للألكانات',
html:()=>`<h3>السلسلة المتماثلة للألكانات</h3><p class="desc">حرّكي المؤشر لإضافة ذرة كربون كل مرة (أي مجموعة <span class="f">CH2</span>)، وراقبي الاسم والصيغة ودرجة الغليان.</p>
 <label class="ctrl">عدد ذرات الكربون n: <b class="ltr" id="srNv"></b><input type="range" dir="ltr" id="srN" min="1" max="10" value="1"></label>

init(root){const up=()=>{const n=+$('#srN',root).value;$('#srNv',root).textContent=n;$('#srName',root).textContent=NM(n);

function rawName(n,subs,bond){const parts=['e','m'].map(t=>{const ps=subs.filter(x=>x.t===t).map(x=>x.p).sort((a,b)=>a-b);return ps.length?ps.join(',')+'-'+MULT[ps.length]+SUBN[t]:'';}).filter(Boolean);const par=parentName(n,bond);return parts.length?parts.join('-')+(/^\d/.test(par)?'-':' ')+par:par;}
function randAlkane(){for(let tries=0;tries<50;tries++){const n=4+Math.floor(Math.random()*4);const k=1+Math.floor(Math.random()*2);const subs=[];for(let i=0;i<k;i++){const t=Math.random()<0.3&&n>=5?'e':'m';const p=t==='e'?3+Math.floor(Math.random()*(n-4)):2+Math.floor(Math.random()*(n-2));if(subs.filter(s=>s.p===p).length<2)subs.push({p,t});}
  if(subs.length)return{n,subs};}return{n:5,subs:[{p:2,t:'m'}]};}
function alkaneDistractors(n,subs,ans){const set=new Set([ans]);const rev=subs.map(s=>({p:n+1-s.p,t:s.t}));[rawName(n,rev),rawName(n+1,subs),rawName(n-1>=3?n-1:n+2,subs.map(s=>({p:Math.min(s.p,Math.max(2,n-2)),t:s.t}))),subs.length>1?subs.map(s=>s.p+'-'+SUBN[s.t]).join('-')+' '+parentName(n):NM(n+subs.length)].forEach(x=>{if(set.size<4)set.add(x);});
  let extra=2;while(set.size<4){set.add(rawName(n,subs.map(s=>({p:s.p+extra%2,t:s.t})))+'');extra++;if(extra>8)set.add(NM(n+extra));}return [...set].slice(1,4);}
SIMS.nameBuilder={title:'ورشة تسمية الألكانات',
html:()=>`<h3>ورشة تسمية الألكانات المتفرعة</h3><p class="desc">اختاري طول السلسلة الرئيسة، ثم أضيفي مجموعات الميثيل والإيثيل في المواقع التي تريدينها، وسيظهر الاسم حسب نظام الأيوباك.</p>
 <div class="lablbl">طول السلسلة الرئيسة</div>${radioChips('nbN',[4,5,6,7,8].map(n=>[n,NM(n)]))}
 <div class="row" style="margin-top:10px"><label class="ctrl">نوع المجموعة<select id="nbT"><option value="m">ميثيل –CH₃</option><option value="e">إيثيل –C₂H₅</option></select></label><label class="ctrl">على ذرة الكربون رقم<select id="nbP"></select></label><button type="button" class="btn sm cold" id="nbAdd" style="align-self:flex-end">➕ أضيفي</button><button type="button" class="btn sm ghost" id="nbClr" style="align-self:flex-end">↺ مسح</button></div>
 <p class="fb" id="nbF"></p><div id="nbD" class="nbd"></div><div class="nbname" id="nbName"></div>
 <div id="nbC" style="margin-top:16px"></div>`,
init(root){let n=4,subs=[];const built=new Set();
  const opts=()=>{const t=$('#nbT',root).value,lo=t==='e'?3:2,hi=t==='e'?n-2:n-1;$('#nbP',root).innerHTML=lo>hi?'<option value="">لا يوجد موقع مناسب</option>':Array.from({length:hi-lo+1},(_,i)=>`<option>${lo+i}</option>`).join('');};
  const up=()=>{$('#nbD',root).innerHTML=MOL(drawChain(n,subs,null,{dx:n>6?60:70}));const nm=NM(n,subs);$('#nbName',root).innerHTML=`الاسم: <b>${nm}</b><br><span class="f">${molFormula(n+subs.reduce((a,s)=>a+(s.t==='e'?2:1),0))}</span>`;fmAll(root);if(subs.length){built.add(nm);if(built.size>=3)completeTask('l2-build');}};
  bindChips(root,'nbN',v=>{n=+v;subs=[];opts();up();});$('#nbT',root).addEventListener('change',opts);
  $('#nbAdd',root).addEventListener('click',()=>{const p=+$('#nbP',root).value,t=$('#nbT',root).value,f=$('#nbF',root);if(!p){f.className='fb bad';f.textContent='السلسلة قصيرة جدًا لهذه المجموعة.';return;}
    if(subs.length>=4){f.className='fb bad';f.textContent='أربع مجموعات تكفي لهذا النشاط.';return;}if(subs.filter(s=>s.p===p).length>=2){f.className='fb bad';f.textContent='ذرة الكربون هذه لا تتسع لأكثر من مجموعتين.';return;}
    subs.push({p,t});f.className='fb ok';f.textContent=t==='m'&&(p===1||p===n)?'':'أضيفت المجموعة. لاحظي كيف يتغير الترقيم ليعطي أصغر الأرقام.';up();});
  $('#nbClr',root).addEventListener('click',()=>{subs=[];up();});opts();up();
  challenge(root,'#nbC',()=>{const {n,subs}=randAlkane();const ans=NM(n,subs);return{p:'ما اسم المركب الآتي؟'+MOL(drawChain(n,subs,null,{dx:n>6?60:70})),o:[ans,...alkaneDistractors(n,subs,ans)],e:'الاسم الصحيح: '+ans};},3,'l2-chal','تحدي التسمية');}};

SIMS.bondBuilder={title:'ورشة الألكينات والألكاينات',
html:()=>`<h3>ورشة الألكينات والألكاينات</h3><p class="desc">اختاري طول السلسلة ونوع الرابطة وموقعها، وراقبي الاسم والصيغة. لاحظي أن الرقم يُختار ليكون الأصغر.</p>

init(root){let p=1;
  const up=()=>{const n=+chipVal(root,'bbN'),o=+chipVal(root,'bbO');if(p>n-1)p=1;
    $('#bbP',root).innerHTML=o===1?'<span class="hint">لا توجد رابطة متعددة.</span>':Array.from({length:n-1},(_,i)=>`<button type="button" class="chip" data-p="${i+1}" aria-pressed="${i+1===p}"><span class="ltr">${i+1} و ${i+2}</span></button>`).join('');
    $$('#bbP .chip',root).forEach(b=>b.addEventListener('click',()=>{p=+b.dataset.p;up();}));
    const bond=o===1?null:{p,o};$('#bbD',root).innerHTML=MOL(drawChain(n,[],bond));const nm=NM(n,[],bond);
    $('#bbName',root).innerHTML=`الاسم: <b>${nm}</b> | الصيغة: <span class="f">${molFormula(n,bond)}</span> | العائلة: <b>${o===1?'ألكان':o===2?'ألكين':'ألكاين'}</b>`;fmAll(root);
    if(o===2&&n>=3)completeTask('l3-ene');if(o===3&&n>=3)completeTask('l3-yne');};
  bindChips(root,'bbN',up);bindChips(root,'bbO',up);up();
  challenge(root,'#bbC',()=>{const n=3+Math.floor(Math.random()*4),o=Math.random()<0.5?2:3,p=1+Math.floor(Math.random()*(n-1));const subs=n>=5&&Math.random()<0.4?[{p:n-1,t:'m'}]:[];const bond={p,o};const ans=NM(n,subs,bond);
    const alt=new Set([ans]);const rp=n-p;[rawName(n,subs,{p:rp===p?p+1:rp,o}),rawName(n,subs,{p,o:o===2?3:2}),rawName(n,subs,{p:Math.min(n-1,p+1),o})+'',NM(n,subs)].forEach(x=>{if(x!==ans)alt.add(x);});
    return{p:'ما اسم المركب الآتي؟'+MOL(drawChain(n,subs,bond)),o:[...alt].slice(0,4),e:'نرقّم من الطرف الأقرب للرابطة المتعددة. الاسم: '+ans};},2,'l3-namech','تحدي التسمية');}};

SIMS.ethylene={title:'تجربة الإيثيلين ونضج الفواكه',
html:()=>`<h3>🍌 صورة تفاعلية: الإيثيلين ونضج الفواكه</h3><p class="desc">موزة خضراء غير ناضجة. جرّبي وضع موزة ناضجة بجانبها (مصدر للإيثيلين)، ووضعهما في كيس مغلق، ثم مرّري الأيام وراقبي النضج.</p>
 <div class="lab"><svg viewBox="0 0 360 260" id="etS" class="labsvg" role="img" aria-label="موزتان وجزيئات الإيثيلين"></svg>
 <div class="labside"><label class="switch"><input type="checkbox" id="etR"> إضافة موزة ناضجة (تطلق الإيثيلين)</label><label class="switch"><input type="checkbox" id="etB"> وضعهما داخل كيس ورقي مغلق</label>
  <label class="ctrl">عدد الأيام: <b class="ltr" id="etDv">0</b><input type="range" dir="ltr" id="etD" min="0" max="8" step="0.5" value="0"></label><div class="lpinfo" id="etI"></div><button type="button" class="btn sm" id="etRec">📋 سجّلي نتيجة هذه الظروف</button></div></div>
 <table class="ctable" style="margin-top:10px"><tr><th>الظروف</th><th>أيام حتى تنضج الموزة الخضراء</th></tr><tbody id="etT"></tbody></table>
 <div class="cmap"><h4>🧪 جزيء الإيثيلين (الإيثين)</h4>${MOL(drawChain(2,[],{p:1,o:2}))}<p class="cm-note">ألكين بسيط صيغته <span class="f">C2H4</span>، يعمل هرمونًا نباتيًا. يستعمله التجار لإنضاج الموز والطماطم بعد نقلها خضراء، وتستعمل المخازن مواد تمتصه لإبطاء النضج.</p></div>
 <div id="etQ" style="margin-top:12px"></div>`,
init(root){const rec=new Set();let raf=0,mol=[];
  const rate=()=>{const r=$('#etR',root).checked,b=$('#etB',root).checked;return 0.09+(r?(b?0.22:0.06):(b?0.03:0));};
  const col=k=>{const g=[107,170,58],y=[242,210,60];if(k<0.75){const t=k/0.75;return `rgb(${g.map((v,i)=>Math.round(v+(y[i]-v)*t)).join(',')})`;}return 'rgb(242,210,60)';};
  const banana=(x,y,c,spots,s=1)=>`<g transform="translate(${x},${y}) scale(${s})"><path d="M-55 -10 Q0 45 60 -18 Q64 -22 58 -26 Q0 20 -50 -20 Z" fill="${c}" stroke="#6b5a1e" stroke-width="2"/><path d="M58 -26 l8 -6" stroke="#5a4a12" stroke-width="4"/>${spots?[...Array(spots)].map((_,i)=>`<circle cx="${-35+i*12}" cy="${-2+((i*7)%9)-4}" r="2.6" fill="#6b4a12"/>`).join(''):''}</g>`;
  const draw=()=>{const d=+$('#etD',root).value,R=$('#etR',root).checked,Bg=$('#etB',root).checked;const k=Math.min(1,d*rate());const spots=k>0.85?Math.round((k-0.85)*40):0;
    const nE=R?(Bg?14:5):(Bg?3:1);
    let s=`<rect x="0" y="210" width="360" height="50" fill="#d9c7a3"/>`;
    if(Bg)s+=`<path d="M40 215 L52 60 L308 60 L320 215 Z" fill="rgba(196,160,110,.35)" stroke="#a8875a" stroke-width="3"/><path d="M52 60 L70 48 L290 48 L308 60" fill="none" stroke="#a8875a" stroke-width="3"/>`;
    s+=banana(120,180,col(k),spots);if(R)s+=banana(240,185,'rgb(240,200,60)',6);

SIMS.cisTrans={title:'سيس وترانس',

SIMS.chiral={title:'ذرة الكربون غير المتماثلة',
html:()=>`<h3>🤚 ذرة الكربون غير المتماثلة وصورة المرآة</h3><p class="desc">اختاري أربع مجموعات ترتبط بذرة الكربون. إذا كانت المجموعات الأربع مختلفة، تصبح الذرة غير متماثلة، ولا تتطابق صورة الجزيء مع صورته في المرآة.</p>
 <div class="chslots">${[0,1,2,3].map(i=>`<label class="ctrl">المجموعة ${i+1}<select data-s="${i}">${GRP.map((g,j)=>`<option value="${j}" ${j===[0,1,0,3][i]?'selected':''}>${g[0]}</option>`).join('')}</select></label>`).join('')}</div>

function initGame(root,g){

  const tick=()=>{left--;const t=$('.timer',box);if(t)t.textContent='⏱ '+left+'s';if(left<=0)end();};
  const start=()=>{score=0;left=45;deck=[];next();clearInterval(timer);timer=setInterval(tick,1000);};
  const end=()=>{clearInterval(timer);const prev=S.games[id]||0;const before=gameStars(prev);if(score>prev){S.games[id]=score;save();refreshStars();}

}

/* ---------- quiz runner ---------- */
function quizRunner(el,qs,opt){
  let order,idx,score,wrong;
  const begin=()=>{order=qs.map(q=>{const p=shuffle(q.o.map((t,i)=>({t,i})));return{...q,opts:p,ans:p.findIndex(x=>x.i===q.a)};});if(opt.shuffle!==false)order=shuffle(order);idx=0;score=0;wrong=[];show();};
  const show=()=>{const q=order[idx];
    el.innerHTML=`<div class="qr"><div class="qtop"><span>السؤال ${idx+1} من ${order.length}${q.y?'<span class="yr">'+(q.y==='--'?'تجميعات':'تحصيلي '+q.y)+'</span>':''}</span><span class="qsc">صحيحة: ${score}</span></div>
     <div class="qbar"><i style="width:${idx/order.length*100}%"></i></div>
     <div class="qtext">${q.q}</div>
     <div class="opts">${q.opts.map((o,i)=>`<button type="button" class="opt" data-i="${i}"><span dir="auto">${fmo(o.t)}</span></button>`).join('')}</div>
     <div class="qx"></div></div>`;
    fmAll(el);
    $$('.opt',el).forEach(b=>b.addEventListener('click',()=>{const i=+b.dataset.i;$$('.opt',el).forEach(x=>x.disabled=true);
      const ok=i===q.ans;if(ok)score++;else wrong.push(q);b.classList.add(ok?'ok':'bad');$$('.opt',el)[q.ans].classList.add('ok');
      $('.qx',el).innerHTML=`<div class="exp ${ok?'ok':'bad'}"><b>${ok?'✓ إجابة صحيحة.':'✗ الإجابة الصحيحة: '+fmo(q.opts[q.ans].t)}</b> ${q.e||''}</div><div class="qnav"><button type="button" class="btn">${idx<order.length-1?'السؤال التالي':'عرض النتيجة'}</button></div>`;
      $('.qsc',el).textContent='صحيحة: '+score;
      $('.qnav button',el).addEventListener('click',()=>{idx++;if(idx<order.length)show();else finish();});
      $('.qnav button',el).focus();}));};
  const finish=()=>{const pct=Math.round(score/order.length*100);opt.onDone&&opt.onDone(score,order.length,pct);
    const msg=pct>=90?'ممتاز! أداء متقن.':pct>=80?'رائع! أنتِ مستعدة.':pct>=60?'جيد، راجعي الأسئلة التي أخطأتِ فيها.':'لا بأس، راجعي الدروس وحاولي مرة أخرى.';
    el.innerHTML=`<div class="qr result"><div class="gscore">${score} / ${order.length}</div><p style="margin:4px 0;font-weight:600">${pct}%: ${msg}</p>
     <div class="row" style="justify-content:center;margin-top:10px"><button type="button" class="btn" id="qAgain">أعيدي الاختبار</button>${opt.extra||''}</div>
     ${wrong.length?'<div class="review"><b>راجعي هذه الأسئلة:</b>'+wrong.map(w=>`<div>${w.q}<br><b>الإجابة:</b> <span dir="auto">${fmo(w.opts[w.ans].t)}</span>. ${w.e||''}</div>`).join('')+'</div>':''}</div>`;
    fmAll(el);$('#qAgain',el).addEventListener('click',()=>opt.restart?opt.restart():begin());};
  if(opt.autostart===false)return{begin};begin();return{begin};
}

async function botAsk(q){

      body:JSON.stringify({ch:CH_NO,lesson:n?LESSONS[n-1].code+' '+LESSONS[n-1].title:'',messages:BOT.turns.slice(-10)})});

  }catch(e){

    if(!teacher){el.innerHTML=card;return;}
    el.innerHTML=`${card}<details style="margin-top:14px" ${A?'':'open'}><summary style="cursor:pointer;font-weight:600">✏️ تعديل المهمة أو نشر مهمة جديدة (يظهر لك فقط بصفتك المعلمة)</summary>
      <label class="fld">عنوان المهمة<input id="aT" value="${esc(A?A.title:'')}"></label>
      <label class="fld">تفاصيل المهمة<textarea id="aD">${esc(A?A.details:'')}</textarea></label>
      <label class="fld">آخر موعد للتسليم<input id="aDue" value="${esc(A?A.due:'')}" placeholder="مثال: الخميس 12 جمادى الأولى"></label>
      <div class="row" style="margin-top:12px"><button type="button" class="btn sm" id="aSave" ${A?'':'disabled'}>حفظ التعديلات</button><button type="button" class="btn sm hot" id="aNew">نشر كمهمة جديدة</button></div>
      <p class="hint">«نشر كمهمة جديدة» يبدأ تسليمًا جديدًا، فتظهر تسليمات المهمة السابقة في قائمة منفصلة.</p><p class="fb" id="aFb"></p></details>`;
    const save=async(isNew)=>{const t=$('#aT').value.trim(),d=$('#aD').value.trim(),due=$('#aDue').value.trim();if(!t||!d){$('#aFb').className='fb bad';$('#aFb').textContent='اكتبي العنوان والتفاصيل.';return;}
      $('#aSave').disabled=$('#aNew').disabled=true;
      try{await db.doc('assignment/current').set({id:isNew||!A?('a'+Date.now()):A.id,title:t,details:d,due,updatedAt:new Date().toISOString()});toast(isNew?'نُشرت المهمة الجديدة':'حُفظت التعديلات');}
      catch(e){$('#aFb').className='fb bad';$('#aFb').textContent='تعذّر الحفظ. تأكدي أنك صاحبة المنصة أو محررة فيها.';}
      finally{if($('#aNew')){$('#aNew').disabled=false;$('#aSave').disabled=!A;}}};
    $('#aSave').addEventListener('click',()=>save(false));$('#aNew').addEventListener('click',()=>save(true));
  }

  /* --- student --- */
  if(!teacher){
    if(!uid){$('#sBox').innerHTML='<div class="notice" style="margin-top:14px">سجّلي الدخول إلى حسابك لتتمكني من تسليم المهمة.</div>';return;}
    cap('assets').then(a=>{assets=a;assetsChecked=true;renderMine();});
    const unM=db.doc('submissions/'+uid).onSnapshot(sn=>{mineLoaded=true;mine=sn.exists?sn.data():null;if(!draft&&mine)draft={name:mine.name||'',note:mine.note||'',files:(mine.files||[]).slice()};renderMine();},()=>{mineLoaded=true;renderMine();});
    onCleanup(unM);
  }
  function renderMine(){
    const el=$('#sBox');if(!el||teacher||!uid)return;
    if(!A){el.innerHTML='';return;}
    if(!mineLoaded){el.innerHTML='<p class="hint" style="margin-top:14px">جارٍ التحقق من تسليمك…</p>';return;}
    if(!draft)draft={name:'',note:'',files:[]};
    const done=mine&&mine.aid===A.id;
    const status=done?`<span class="stat ok">✓ سلّمتِ المهمة في ${esc(fdate(mine.at))}</span>`:`<span class="stat no">لم تُسلّمي بعد</span>`;
    const fb=done&&(mine.feedback||mine.grade)?`<div class="fb-box"><b>ملاحظات المعلمة:</b> ${esc(mine.feedback||'')}${mine.grade?`<br><b>الدرجة:</b> ${esc(mine.grade)}`:''}</div>`:'';
    let form='';
    if(assetsChecked&&!assets){form=`<div class="notice" style="margin-top:12px">لا تملكين صلاحية رفع الملفات في هذه المنصة. اطلبي من معلمتك مشاركة المنصة معك بصلاحية «مساهِمة» (Contributor).</div>`;}
    else{form=`<label class="fld">اسمك وشعبتك<input id="sName" value="${esc(draft.name)}" placeholder="مثال: نورة محمد، 2/3"></label>
      <div class="drop" id="sDrop" tabindex="0" role="button">📤 اضغطي لاختيار ملف الإجابة أو اسحبيه إلى هنا<br><small style="color:var(--muted)">صور (JPG أو PNG) أو PDF، حتى 20 MB للملف. ملفات Word احفظيها PDF أولًا.</small><input type="file" id="sFile" multiple accept="image/png,image/jpeg,image/webp,application/pdf,.txt" hidden></div>
      <div class="flist" id="sList">${draft.files.map((f,i)=>`<div class="fitem"><span>${f.id?fileLink(f):esc(f.name)+' <span style="color:var(--muted)">جارٍ الرفع…</span>'}</span>${f.id?`<button type="button" data-rm="${i}">حذف</button>`:''}</div>`).join('')}</div>
      <label class="fld">ملاحظة لمعلمتك (اختياري)<textarea id="sNote" style="min-height:70px">${esc(draft.note)}</textarea></label>
      <div class="row" style="margin-top:12px"><button type="button" class="btn" id="sSend" style="background:var(--green);color:#fff">${done?'تحديث التسليم':'سلّمي المهمة'}</button></div><p class="fb" id="sFb"></p>`;}
    el.innerHTML=`<div style="margin-top:18px"><h3 style="margin:0 0 8px">تسليمك</h3>${status}${fb}${form}</div>`;
    if(!assets)return;
    const fi=$('#sFile'),dr=$('#sDrop');
    $('#sName').addEventListener('input',e=>draft.name=e.target.value);$('#sNote').addEventListener('input',e=>draft.note=e.target.value);
    dr.addEventListener('click',()=>fi.click());dr.addEventListener('keydown',e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();fi.click();}});
    dr.addEventListener('dragover',e=>{e.preventDefault();dr.classList.add('over');});dr.addEventListener('dragleave',()=>dr.classList.remove('over'));
    dr.addEventListener('drop',e=>{e.preventDefault();dr.classList.remove('over');addFiles(e.dataTransfer.files);});
    fi.addEventListener('change',()=>addFiles(fi.files));
    $$('[data-rm]',el).forEach(b=>b.addEventListener('click',()=>{const f=draft.files[+b.dataset.rm];draft.files.splice(+b.dataset.rm,1);const inSaved=mine&&(mine.files||[]).some(x=>x.id===f.id);if(!inSaved&&f.id)assets.delete(f.id).catch(()=>{});renderMine();}));
    $('#sSend').addEventListener('click',submit);
  }
  async function addFiles(list){
    const fb=()=>$('#sFb');
    for(const f of Array.from(list)){
      const t=guessType(f);
      if(!OK_TYPES.test(t)){if(fb()){fb().className='fb bad';fb().textContent='الملف «'+f.name+'» بصيغة غير مدعومة. استعملي صورة JPG أو PNG أو ملف PDF.';}continue;}
      if(f.size>20*1048576){if(fb()){fb().className='fb bad';fb().textContent='الملف «'+f.name+'» أكبر من 20 MB.';}continue;}
      const item={name:f.name,size:f.size};draft.files.push(item);renderMine();
      try{const r=await assets.upload(f,{type:t});item.id=r.id;item.size=r.sizeBytes;item.type=r.contentType;}
      catch(e){draft.files.splice(draft.files.indexOf(item),1);if(fb()){fb().className='fb bad';fb().textContent=e&&e.code==='quota_exceeded'?'امتلأت مساحة التخزين في المنصة. أخبري معلمتك.':'تعذّر رفع «'+f.name+'». جرّبي مرة أخرى أو بصيغة أخرى.';}}
      renderMine();
    }
  }
  async function submit(){
    const fb=$('#sFb');
    if(draft.files.some(f=>!f.id)){fb.className='fb bad';fb.textContent='انتظري حتى يكتمل رفع الملفات.';return;}
    if(!draft.name.trim()){fb.className='fb bad';fb.textContent='اكتبي اسمك وشعبتك.';return;}
    if(!draft.files.length){fb.className='fb bad';fb.textContent='ارفعي ملف إجابتك أولًا.';return;}
    $('#sSend').disabled=true;
    try{await db.doc('submissions/'+uid).set({aid:A.id,name:draft.name.trim(),note:draft.note.trim(),files:draft.files.map(f=>({id:f.id,name:f.name,size:f.size||0,type:f.type||''})),at:new Date().toISOString()});toast('📎 تم تسليم المهمة بنجاح');}
    catch(e){fb.className='fb bad';fb.textContent=e&&e.code==='invalid_argument'?'لا تملكين صلاحية التسليم. اطلبي من معلمتك صلاحية «مساهِمة».':'تعذّر التسليم الآن. حاولي مرة أخرى.';if($('#sSend'))$('#sSend').disabled=false;}
  }

  /* --- teacher --- */
  if(teacher){
    const unS=db.collection('submissions').onSnapshot(q=>{subsLoaded=true;subs=q.docs.map(d=>({uid:d.id,...d.data()}));renderSubs();},()=>{subsLoaded=true;renderSubs();});
    onCleanup(unS);
  }
  async function renderSubs(){
    const el=$('#sBox');if(!el||!teacher)return;
    if(!subsLoaded){el.innerHTML='<p class="hint" style="margin-top:14px">جارٍ تحميل التسليمات…</p>';return;}
    const cur=subs.filter(x=>A&&x.aid===A.id).sort((a,b)=>(b.at||'').localeCompare(a.at||''));
    const old=subs.filter(x=>!A||x.aid!==A.id);
    let names={};try{if(user)names=await user.profiles(subs.map(x=>x.uid));}catch(e){}
    if(!$('#sBox'))return;
    const card=x=>{const p=names[x.uid];const acc=p&&p.name?` <span style="color:var(--muted);font-size:13.5px">(${esc(p.name)})</span>`:'';
      return `<div class="subcard"><div class="row" style="justify-content:space-between"><b>${esc(x.name||'بدون اسم')}${acc}</b><span class="hint" style="margin:0">${esc(fdate(x.at))}</span></div>
      ${x.note?`<div style="font-size:15px">📝 ${esc(x.note)}</div>`:''}
      <div class="flist">${(x.files||[]).map(f=>`<div class="fitem"><span>${fileLink(f)}</span></div>`).join('')}</div>
      <div class="row"><input class="ans" style="width:110px;text-align:center" data-g="${esc(x.uid)}" value="${esc(x.grade||'')}" placeholder="الدرجة" aria-label="الدرجة"><input class="tinput" style="flex:1;min-width:160px" data-f="${esc(x.uid)}" value="${esc(x.feedback||'')}" placeholder="ملاحظة للطالبة" aria-label="ملاحظة"><button type="button" class="btn sm" data-sv="${esc(x.uid)}">حفظ</button></div></div>`;};
    el.innerHTML=`<div style="margin-top:20px"><h3 style="margin:0 0 4px">تسليمات الطالبات (${cur.length})</h3><p class="hint" style="margin:0">تظهر هذه القائمة لك فقط. الدرجة والملاحظة تظهران للطالبة في صفحة تسليمها.</p>
      <div class="subgrid">${cur.length?cur.map(card).join(''):'<div class="notice">لم تصل تسليمات لهذه المهمة بعد.</div>'}</div>
      ${old.length?`<button type="button" class="btn sm ghost" id="oldT" style="margin-top:14px">${showOld?'إخفاء':'عرض'} تسليمات المهام السابقة (${old.length})</button>${showOld?`<div class="subgrid">${old.map(card).join('')}</div>`:''}`:''}</div>`;
    const oT=$('#oldT');if(oT)oT.addEventListener('click',()=>{showOld=!showOld;renderSubs();});
    $$('[data-sv]',el).forEach(b=>b.addEventListener('click',async()=>{const id=b.dataset.sv;b.disabled=true;
      try{await db.doc('submissions/'+id).update({grade:$(`[data-g="${id}"]`,el).value.trim(),feedback:$(`[data-f="${id}"]`,el).value.trim()});toast('حُفظت الملاحظة');}
      catch(e){toast('تعذّر الحفظ');}finally{b.disabled=false;}}));
  }
}

applyTheme();
initBot();
window.matchMedia('(prefers-color-scheme: dark)').addEventListener('change',()=>{applyTheme();window.dispatchEvent(new Event('themechange'));});
route();
if(window.Chem22Student){restoreProgress();Chem22Student.onChange(()=>{if(!location.hash||location.hash==="#home")route();restoreProgress();});}
</script>
</body>
</html>
