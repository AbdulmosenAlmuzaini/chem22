<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>مختبر الاتزان الكيميائي | كيمياء 2-2</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@300;400;500;600;700&family=Noto+Kufi+Arabic:wght@500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#F1EBFC; --surface:#FFFFFF; --surface2:#F8F5FE; --ink:#1E1638; --muted:#5E5677; --line:#DCD2F1; --grid:rgba(124,77,214,.11); --head:var(--ink);
  --cold:#2763D8; --hot:#DE4527; --mid:#8A4FC8; --amber:#D18A0B; --ok:#12916A; --bad:#C7362A; --chip:#ECE4FA; --green:#6D3FC4;
  --cold-soft:#E3ECFC; --hot-soft:#FCE7E2; --ok-soft:#DFF4EC; --bad-soft:#FBE4E1;
  color-scheme:light;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#16112A; --surface:#201A3A; --surface2:#271F45; --ink:#EEE9FA; --muted:#B3A9CF; --line:#3A3160; --grid:rgba(184,140,255,.08); --head:var(--ink);
    --cold:#6E9BFF; --hot:#FF7B5E; --mid:#B88CFF; --amber:#F4BD4C; --ok:#3CC799; --bad:#FF6E61; --chip:#2D2552; --green:#7E55D6;
    --cold-soft:#1C2C55; --hot-soft:#3A2028; --ok-soft:#143A33; --bad-soft:#3D1F25;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#16112A; --surface:#201A3A; --surface2:#271F45; --ink:#EEE9FA; --muted:#B3A9CF; --line:#3A3160; --grid:rgba(184,140,255,.08); --head:var(--ink);
  --cold:#6E9BFF; --hot:#FF7B5E; --mid:#B88CFF; --amber:#F4BD4C; --ok:#3CC799; --bad:#FF6E61; --chip:#2D2552; --green:#7E55D6;
  --cold-soft:#1C2C55; --hot-soft:#3A2028; --ok-soft:#143A33; --bad-soft:#3D1F25;
  color-scheme:dark;
}
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);--thermal:linear-gradient(to left,var(--cold),var(--mid) 55%,var(--hot));}
html{scroll-padding-top:env(safe-area-inset-top,0px);}
*,*::before,*::after{box-sizing:border-box}
body{margin:0;background-color:var(--bg);background-image:linear-gradient(var(--grid) 1px,transparent 1px),linear-gradient(90deg,var(--grid) 1px,transparent 1px);background-size:26px 26px;color:var(--ink);font-family:"IBM Plex Sans Arabic",system-ui,"Segoe UI",Tahoma,sans-serif;font-size:17px;line-height:1.75;-webkit-font-smoothing:antialiased}
img,svg,canvas{max-width:100%}
.kufi,h1,h2,h3,.lnum,.lcode,.gscore,.temp-big,.brand,.lcard h3,.final-band h3,.teacher .av{font-family:"Noto Kufi Arabic","IBM Plex Sans Arabic",system-ui,sans-serif}
.hero h1{font-weight:800;line-height:1.35}
h1,h2,h3,.lcard h3{color:var(--head)}
.lhead h1{color:var(--head)}
.teacher{display:flex;align-items:center;gap:12px;margin:6px 0 20px}
.teacher .av{flex:0 0 48px;height:48px;border-radius:50%;background:var(--cold);color:#fff;display:grid;place-items:center;font-weight:700;font-size:18px}
.teacher small{display:block;color:var(--muted);font-size:15px;line-height:1.4}
.teacher b{display:block;font-size:17px;line-height:1.5}
.wrap{max-width:1100px;margin:0 auto;padding:0 20px}
a{color:var(--cold)}
button{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--amber);outline-offset:2px;border-radius:6px}
.f{font-family:"IBM Plex Sans Arabic",system-ui,sans-serif;unicode-bidi:isolate;display:inline-block;max-width:100%}
.tinput{font:inherit;font-size:15px;padding:8px 10px;border-radius:8px;border:1.5px solid var(--line);background:var(--surface2);color:var(--ink)}
.hcard .f,.target .f,.sum .f,.ctable .f,.ediag .f{white-space:nowrap}
.f sub,.fx sub{font-size:.68em}
.ltr{direction:ltr;unicode-bidi:isolate}

/* top bar */
.top{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:14px 0}
.brand{display:flex;align-items:center;gap:10px;text-decoration:none;color:var(--ink);font-weight:600}
.brand-mark{width:34px;height:34px;border-radius:50%;background:var(--thermal);display:grid;place-items:center;color:#fff;font-size:15px}
.top-tools{display:flex;align-items:center;gap:10px}
.starpill{display:flex;align-items:center;gap:6px;background:var(--surface);border:1px solid var(--line);border-radius:999px;padding:4px 12px;font-weight:600}
.starpill b{color:var(--amber)}
.iconbtn{background:var(--surface);border:1px solid var(--line);border-radius:999px;padding:5px 12px;cursor:pointer;font-size:14px}

/* buttons */
.btn{display:inline-flex;align-items:center;gap:8px;border:0;border-radius:10px;padding:11px 20px;font-weight:600;cursor:pointer;background:var(--ink);color:var(--bg);text-decoration:none;transition:transform .12s}
.btn:active{transform:scale(.97)}
.btn.cold{background:var(--cold);color:#fff}
.btn.hot{background:var(--hot);color:#fff}
.btn.ghost{background:transparent;color:var(--ink);border:1.5px solid var(--line)}
.btn.sm{padding:7px 14px;font-size:15px;border-radius:8px}
.btn[disabled]{opacity:.45;cursor:not-allowed}

/* hero */
.hero{display:grid;grid-template-columns:1.05fr .95fr;gap:36px;align-items:center;padding:26px 0 40px}
.kicker{color:var(--muted);font-size:15px;margin:0 0 6px}
.hero h1{font-size:clamp(2rem,4.6vw,3.25rem);line-height:1.22;margin:0 0 16px;font-weight:700;letter-spacing:-.01em}
.hero h1 .grad{background:var(--thermal);-webkit-background-clip:text;background-clip:text;color:transparent}
.idea{background:var(--surface);border-inline-start:5px solid var(--mid);border-radius:4px 12px 12px 4px;padding:12px 16px;margin:0 0 16px}
.idea strong{color:var(--mid)}
.hero p.lead{color:var(--muted);margin:0 0 20px;max-width:58ch}
.hero-actions{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.progress-line{margin-top:18px;color:var(--muted);font-size:15px}
.credit-card{margin-top:20px;font-size:19px;color:var(--muted);line-height:1.6}
.credit-card b{color:var(--mid);font-weight:700}
.task-band{margin-top:-14px}
.tb-in{display:flex;align-items:center;gap:16px}
.tb-in .ti{flex:0 0 54px;height:54px;border-radius:14px;background:var(--thermal);display:grid;place-items:center;font-size:27px}
.task-tile{display:flex;align-items:center;gap:14px;margin-top:18px;background:var(--surface);border:2px solid var(--mid);border-radius:16px;padding:12px 18px 12px 14px;text-decoration:none;color:var(--ink);max-width:440px;transition:transform .15s}
.task-tile:hover{transform:translateY(-2px)}
.task-tile .ti{flex:0 0 54px;height:54px;border-radius:14px;background:var(--thermal);display:grid;place-items:center;font-size:27px}
.task-tile b{display:block;font-size:18px}
.task-tile small{color:var(--muted);font-size:14px}

.beaker-card{background:var(--surface);border:1px solid var(--line);border-radius:22px;padding:16px;position:relative}
.beaker-card canvas{display:block;width:100%;height:330px;touch-action:none;cursor:ew-resize;border-radius:14px;background:var(--surface2)}
.beaker-read{display:flex;justify-content:space-between;align-items:center;margin-top:10px;gap:10px;flex-wrap:wrap}
.temp-big{font-size:30px;font-weight:700;direction:ltr}
.phase-tag{padding:3px 12px;border-radius:999px;font-weight:600;font-size:15px;background:var(--chip)}
.beaker-card input[type=range]{width:100%;margin-top:8px}
.hint{font-size:14px;color:var(--muted);margin:6px 0 0}

/* path */
h2.sec{font-size:clamp(1.35rem,2.6vw,1.8rem);margin:8px 0 6px}
.sec-sub{color:var(--muted);margin:0 0 20px}
.thermo-track{position:relative;height:14px;border-radius:999px;background:var(--thermal);margin:22px 0 0}
.thermo-track .bulb{position:absolute;inset-inline-start:-8px;top:50%;transform:translateY(-50%);width:28px;height:28px;border-radius:50%;background:var(--cold)}
.lessons{display:grid;grid-template-columns:repeat(3,1fr);gap:16px;margin-top:-7px}
.lcard{position:relative;background:var(--surface);border:1px solid var(--line);border-radius:0 0 16px 16px;padding:26px 18px 18px;display:flex;flex-direction:column;gap:8px}
.lcard .node{position:absolute;top:-8px;inset-inline-start:18px;width:30px;height:30px;border-radius:50%;background:var(--surface);border:4px solid var(--c);display:grid;place-items:center;font-size:13px;font-weight:700;color:var(--c)}
.lcard.done .node{background:var(--c);color:#fff}
.lcode{font-size:34px;font-weight:700;color:var(--c);line-height:1;direction:ltr;text-align:right}
.lcard h3{margin:2px 0 0;font-size:19px;line-height:1.4}
.lcard p{margin:0;color:var(--muted);font-size:15px;line-height:1.6;flex:1}
.lmeta{display:flex;justify-content:space-between;align-items:center;font-size:14px;color:var(--muted)}
.lmeta .st{color:var(--amber);font-weight:600}

.badges{display:flex;flex-wrap:wrap;gap:14px;margin:8px 0 0}
.badge{display:flex;align-items:center;gap:10px;background:var(--surface);border:1px dashed var(--line);border-radius:999px;padding:6px 16px 6px 8px;color:var(--muted);font-size:15px}
.badge i{font-style:normal;width:34px;height:34px;border-radius:50%;display:grid;place-items:center;background:var(--chip);filter:grayscale(1);opacity:.6;font-size:18px}
.badge.on{border-style:solid;color:var(--ink);font-weight:600}
.badge.on i{filter:none;opacity:1;background:var(--thermal)}

.final-band{margin:36px 0;background:var(--surface);border:1px solid var(--line);border-radius:20px;padding:24px;display:grid;grid-template-columns:1fr auto;gap:18px;align-items:center;position:relative;overflow:hidden}
.final-band::before{content:"";position:absolute;inset-block:0;inset-inline-start:0;width:6px;background:var(--thermal)}
.final-band h3{margin:0 0 4px;font-size:22px}
.final-band p{margin:0;color:var(--muted)}

footer.foot{border-top:1px solid var(--line);margin-top:40px;padding:22px 0 30px;color:var(--muted);font-size:14px;text-align:center;line-height:1.7}
footer.foot b{color:var(--ink)}

/* lesson page */
.crumbs{margin:6px 0 10px}
.crumbs a{text-decoration:none;font-size:15px}
.lhead{display:grid;grid-template-columns:auto 1fr;gap:24px;align-items:end;padding:10px 0 22px;border-bottom:1px solid var(--line)}
.lnum{font-size:clamp(4rem,11vw,7.5rem);font-weight:700;line-height:.9;direction:ltr;background:var(--thermal);-webkit-background-clip:text;background-clip:text;color:transparent}
.lhead h1{margin:0;font-size:clamp(1.7rem,3.6vw,2.4rem);line-height:1.3}
.lhead .en{color:var(--muted);direction:ltr;text-align:right;font-size:16px}
.vocab{display:flex;flex-wrap:wrap;gap:8px;margin:12px 0 0}
.vocab span{background:var(--chip);border-radius:6px;padding:2px 10px;font-size:14px}

.lgrid{display:grid;grid-template-columns:300px 1fr;gap:28px;margin-top:24px;align-items:start}
.side{position:sticky;top:12px;display:flex;flex-direction:column;gap:16px}
.box{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:16px 18px}
.box h4{margin:0 0 8px;font-size:16px}
.tasks{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:8px}
.tasks li{display:flex;gap:10px;align-items:flex-start;font-size:15px;line-height:1.5;color:var(--muted)}
.tasks li .ck{flex:0 0 22px;height:22px;border-radius:6px;border:2px solid var(--line);display:grid;place-items:center;font-size:13px;margin-top:1px}
.tasks li.on{color:var(--ink)}
.tasks li.on .ck{background:var(--ok);border-color:var(--ok);color:#fff}
.tbar{height:8px;border-radius:99px;background:var(--chip);overflow:hidden;margin-top:12px}
.tbar i{display:block;height:100%;background:var(--thermal);width:0;transition:width .4s}
.side nav{display:flex;flex-direction:column;gap:2px}
.side nav a{text-decoration:none;color:var(--muted);font-size:15px;padding:4px 8px;border-radius:6px}
.side nav a:hover{background:var(--chip);color:var(--ink)}

.learn ul{margin:0;padding-inline-start:20px}
.learn li{margin:0 0 8px}
.main-col{display:flex;flex-direction:column;gap:26px;min-width:0}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:22px;min-width:0}
.panel.sim{border-top:4px solid var(--c,var(--cold))}
.panel h3{margin:0 0 4px;font-size:21px;line-height:1.4}
.panel .tag{display:inline-block;font-size:13px;font-weight:600;color:var(--c,var(--cold));margin-bottom:4px}
.panel .desc{color:var(--muted);margin:0 0 16px;font-size:15.5px}
.row{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.ctrl{display:flex;flex-direction:column;gap:4px;font-size:15px;color:var(--muted);flex:1;min-width:180px}
input[type=range]{accent-color:var(--mid);width:100%}
input[type=number],input[type=text],input.ans,select{font:inherit;font-size:16px;padding:8px 10px;border-radius:8px;border:1.5px solid var(--line);background:var(--surface2);color:var(--ink);min-width:0}
input.ans{width:150px;direction:ltr;text-align:center}
.unit{color:var(--muted);font-size:15px}

.prac{background:var(--surface2);border:1px solid var(--line);border-radius:12px;padding:14px 16px;margin-top:14px}
.prac p.q{margin:0 0 10px;font-size:16px}
.prac .fb{margin:8px 0 0;font-size:15px;min-height:1.2em}
.fb.ok{color:var(--ok)} .fb.bad{color:var(--bad)}
.prac.solved{border-color:var(--ok);background:var(--ok-soft)}

/* skier */
.bars{display:grid;gap:8px;margin-top:12px}
.bar{display:grid;grid-template-columns:120px 1fr 50px;gap:10px;align-items:center;font-size:14.5px}
.bar .tr{height:16px;background:var(--chip);border-radius:99px;overflow:hidden}
.bar .tr i{display:block;height:100%;border-radius:99px;transition:width .08s}
.bar b{direction:ltr;text-align:left;font-weight:600}
.switch{display:inline-flex;align-items:center;gap:8px;cursor:pointer;font-size:15px}

/* chips */
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{border:1.5px solid var(--line);background:var(--surface2);border-radius:999px;padding:5px 14px;cursor:pointer;font-size:14.5px}
.chip[aria-pressed=true]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.thermos{display:grid;grid-template-columns:repeat(auto-fit,minmax(78px,1fr));gap:12px;margin-top:16px;align-items:end}
.thermo{display:flex;flex-direction:column;align-items:center;gap:6px;font-size:13.5px;text-align:center}
.thermo .tube{width:22px;height:170px;border-radius:12px;background:var(--chip);position:relative;overflow:hidden;border:2px solid var(--line)}
.thermo .tube i{position:absolute;bottom:0;inset-inline:0;background:linear-gradient(to top,var(--cold),var(--hot));transition:height .25s}
.thermo b{direction:ltr;font-size:14px}

/* options quiz */
.opts{display:grid;gap:8px;margin-top:10px}
.opt{text-align:start;border:1.5px solid var(--line);background:var(--surface2);border-radius:10px;padding:10px 14px;cursor:pointer;font-size:16px;line-height:1.5}
.opt:hover:not([disabled]){border-color:var(--mid)}
.opt.ok{background:var(--ok-soft);border-color:var(--ok)}
.opt.bad{background:var(--bad-soft);border-color:var(--bad)}
.opt[disabled]{cursor:default}

/* calorimeter */
.calo{display:grid;grid-template-columns:220px 1fr;gap:20px;align-items:start}
.calo svg{width:100%;height:auto}
.dtable{width:100%;border-collapse:collapse;font-size:15px}
.dtable td{padding:6px 8px;border-bottom:1px solid var(--line)}
.dtable td:last-child{direction:ltr;text-align:left;font-weight:600}
.ctable{width:100%;border-collapse:collapse;font-size:14px;margin-top:6px}
.ctable th,.ctable td{padding:5px 8px;border-bottom:1px solid var(--line);text-align:start}
.ctable td.n{direction:ltr;text-align:left}

/* packs */
.packs{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:14px}
.ediag{display:grid;grid-template-columns:1fr 150px;gap:16px;align-items:stretch;background:var(--surface2);border-radius:12px;padding:16px}
.levels{position:relative;min-height:220px;border-inline-start:2px solid var(--muted);padding-inline-start:12px}
.levels .axis{position:absolute;inset-inline-start:-28px;top:50%;transform:translateY(-50%) rotate(-90deg);font-size:13px;color:var(--muted);white-space:nowrap}
.lv{position:absolute;inset-inline:12px;border-top:2px dashed var(--muted);font-size:15px;padding-top:2px}
.lv span{background:var(--chip);padding:1px 8px;border-radius:6px}
.lv.top{top:20px}.lv.bot{top:170px}
.arrowv{position:absolute;inset-inline-end:30%;top:30px;height:140px;width:4px;border-radius:4px}
.arrowv::after{content:"";position:absolute;inset-inline-start:-7px;border:9px solid transparent}
.arrowv.down{background:var(--hot)} .arrowv.down::after{bottom:-14px;border-top-color:var(--hot)}
.arrowv.up{background:var(--cold)} .arrowv.up::after{top:-14px;border-bottom-color:var(--cold)}
.dhlabel{position:absolute;inset-inline-end:calc(30% + 14px);top:84px;font-weight:700;direction:ltr}
.flow{display:flex;flex-direction:column;justify-content:center;align-items:center;gap:8px;text-align:center;font-size:14.5px;border-radius:10px;padding:10px}
.flow .big{font-size:30px}

/* heating curve */
.hc canvas{width:100%;height:300px;display:block;background:var(--surface2);border-radius:12px}
.seglist{display:grid;gap:6px;margin-top:12px}
.seg{display:grid;grid-template-columns:24px 1fr auto;gap:10px;align-items:center;padding:6px 10px;border-radius:8px;font-size:14.5px;border:1px solid transparent}
.seg.on{border-color:var(--mid);background:var(--chip)}
.seg .dot{width:12px;height:12px;border-radius:50%}
.seg b{direction:ltr}

/* hess */
.tabs{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:14px}
.tab{border:1.5px solid var(--line);background:var(--surface2);border-radius:8px;padding:6px 14px;cursor:pointer;font-size:15px}
.tab[aria-selected=true]{background:var(--mid);color:#fff;border-color:var(--mid)}
.tab.solved::after{content:" ✓"}
.target{background:var(--surface2);border:1.5px dashed var(--mid);border-radius:12px;padding:12px 14px;margin-bottom:12px;font-size:17px;overflow-x:auto}
.hcard{display:grid;grid-template-columns:1fr auto;gap:10px;align-items:center;border:1px solid var(--line);border-radius:12px;padding:10px 12px;margin-bottom:8px;background:var(--surface)}
.hcard .eq{font-size:16.5px;overflow-x:auto;padding-bottom:2px}
.hcard .dh{direction:ltr;font-weight:600;font-size:14.5px;color:var(--muted)}
.hcard .tools{display:flex;gap:6px;flex-wrap:wrap}
.sum{border-top:2px solid var(--ink);margin-top:8px;padding-top:10px;font-size:17px;overflow-x:auto}
.status{margin-top:10px;padding:10px 14px;border-radius:10px;font-weight:600}
.status.ok{background:var(--ok-soft);color:var(--ok)}
.status.wait{background:var(--chip);color:var(--muted)}

/* ladder */
.ladwrap{display:grid;grid-template-columns:1fr 1fr;gap:20px}
.ladder{position:relative;height:440px;background:var(--surface2);border-radius:12px}
.ladder .ax{position:absolute;top:12px;bottom:12px;inset-inline-start:50%;width:3px;background:var(--thermal);transform:translateX(50%)}
.lpt{position:absolute;transform:translateY(-50%);display:flex;align-items:center;gap:6px;cursor:pointer;border:0;background:transparent;padding:0;font-size:14px}
.lpt .ln{width:34px;height:2px;background:var(--muted)}
.lpt span{background:var(--surface);border:1px solid var(--line);border-radius:6px;padding:1px 8px;direction:ltr;white-space:nowrap}
.lpt.r{inset-inline-start:calc(50% + 2px)}
.lpt.l{inset-inline-end:calc(50% + 2px);flex-direction:row-reverse}
.lpt.zero span{background:var(--chip)}
.lpt:hover span,.lpt.sel span{border-color:var(--mid);box-shadow:0 0 0 2px var(--mid)}

/* games */
.game .gbox{background:var(--surface2);border-radius:14px;padding:20px;text-align:center;min-height:230px;display:flex;flex-direction:column;justify-content:center;align-items:center;gap:12px}
.ghead{display:flex;justify-content:space-between;width:100%;font-weight:600;font-size:15px}
.timer{direction:ltr}
.gprompt{font-size:20px;font-weight:600;line-height:1.5;max-width:46ch}
.gopts{display:flex;flex-wrap:wrap;gap:10px;justify-content:center}
.gopts .opt{min-width:120px;text-align:center}
.gscore{font-size:42px;font-weight:700;direction:ltr}
.flash-ok{animation:fo .35s}
.flash-bad{animation:fb .35s}
@keyframes fo{50%{background:var(--ok-soft)}}
@keyframes fb{50%{background:var(--bad-soft)}}
.stars3{font-size:28px;letter-spacing:4px;color:var(--amber)}

<script src="/student.js"></script>
<script>
"use strict";
const $=(s,r=document)=>r.querySelector(s);
const $$=(s,r=document)=>Array.from(r.querySelectorAll(s));
const LS='equil22-sabah-ch3-v1';
let S={tasks:{},games:{},quiz:{},done:{},final:null,theme:null};
try{const raw=localStorage.getItem(LS);if(raw)S=Object.assign(S,JSON.parse(raw));}catch(e){}
function save(){try{localStorage.setItem(LS,JSON.stringify(S));}catch(e){}try{autoSync();}catch(e){}}
const reduced=window.matchMedia('(prefers-reduced-motion: reduce)').matches;
let cleanups=[];
function onCleanup(fn){cleanups.push(fn);}

/* ---------- helpers ---------- */
function fm(s){return String(s).replace(/([A-Za-z\)])(\d+)/g,'$1<sub>$2</sub>').replace(/\((s|l|g|aq)\)/g,'<sub>($1)</sub>');}
function fmAll(root){$$('.f',root).forEach(e=>{if(!e.dataset.fm){e.innerHTML=fm(e.textContent);e.dataset.fm='1';e.setAttribute('dir','ltr');}});}
function shuffle(a){a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;}
function parseNum(s){
  s=String(s).trim().replace(/[٠-٩]/g,d=>'٠١٢٣٤٥٦٧٨٩'.indexOf(d)).replace(/[٫]/g,'.').replace(/[,،\s]/g,'').replace(/[−–]/g,'-');
  const m=s.match(/^([+-]?\d*\.?\d+)[×xX\*]10\^?([+-]?\d+)$/);
  if(m)return parseFloat(m[1])*Math.pow(10,+m[2]);
  if(s==='')return NaN; const v=Number(s); return isFinite(v)?v:NaN;
}
const SUP={'-':'⁻','0':'⁰','1':'¹','2':'²','3':'³','4':'⁴','5':'⁵','6':'⁶','7':'⁷','8':'⁸','9':'⁹'};
function nice(x,p=3){
  if(!isFinite(x))return '—';
  const a=Math.abs(x);
  if(a!==0&&(a>=1e5||a<1e-3)){const e=Math.floor(Math.log10(a));const m=x/Math.pow(10,e);return (+m.toFixed(p-1))+' × 10'+String(e).split('').map(c=>SUP[c]).join('');}
  return String(+x.toPrecision(Math.max(p,String(Math.round(a)).length)));
}
function sci(x){const e=Math.floor(Math.log10(Math.abs(x)));return (x/Math.pow(10,e)).toFixed(2)+' × 10'+String(e).split('').map(c=>SUP[c]).join('');}
function sgn(x){x=Math.round(x*10)/10;return (x>0?'+':'')+x;}
function cssv(n){return getComputedStyle(document.documentElement).getPropertyValue(n).trim();}
function toast(msg){const t=$('#toast');t.innerHTML='<div>'+msg+'</div>';const d=t.firstChild;requestAnimationFrame(()=>d.classList.add('show'));setTimeout(()=>{d.classList.remove('show');},2600);}

/* ---------- scoring ---------- */
function gameStars(b){return b>=15?3:b>=10?2:b>=5?1:0;}
function totalStars(){let n=Object.keys(S.tasks).length;for(const k in S.games)n+=gameStars(S.games[k]);for(const k in S.quiz)if(S.quiz[k]>=4)n+=3;if(S.final!=null&&S.final>=80)n+=5;return n;}
function refreshStars(){$('#starCount').textContent=totalStars();}
function completeTask(id){
  if(S.tasks[id])return;S.tasks[id]=true;save();refreshStars();
  const li=document.querySelector('[data-task-li="'+id+'"]');if(li){li.classList.add('on');li.querySelector('.ck').textContent='✓';}
  updateTaskBar();toast('★ أحسنتِ! أنجزتِ مهمة جديدة');
}
function updateTaskBar(){const b=$('#tbar');if(!b)return;const n=+b.dataset.lesson;const ts=LESSONS[n-1].tasks;const d=ts.filter(t=>S.tasks[t.id]).length;b.style.width=(d/ts.length*100)+'%';const c=$('#tcount');if(c)c.textContent=d+' من '+ts.length;}

/* ---------- theme ---------- */
function effectiveDark(){return S.theme?S.theme==='dark':window.matchMedia('(prefers-color-scheme: dark)').matches;}
function applyTheme(){if(S.theme)document.documentElement.setAttribute('data-theme',S.theme);else document.documentElement.removeAttribute('data-theme');$('#themeBtn').textContent=effectiveDark()?'الوضع النهاري':'الوضع الليلي';}
$('#themeBtn').addEventListener('click',()=>{S.theme=effectiveDark()?'light':'dark';save();applyTheme();window.dispatchEvent(new Event('themechange'));});

/* ---------- data ---------- */
const TASK_FORM='https://forms.gle/LmYWNb5ZK4KPCCLS9';
const LESSONS=[
{n:1,code:'3-1',title:'حالة الاتزان الديناميكي',en:'A State of Dynamic Balance',c:'var(--cold)',
 idea:'الاتزان الكيميائي حالة ديناميكية تتساوى فيها سرعتا التفاعلين الأمامي والعكسي، فتبقى تراكيز المواد ثابتة.',
 blurb:'التفاعلات العكسية، الاتزان الديناميكي، قانون الاتزان وثابت الاتزان Keq.',
 vocab:['التفاعل العكسي','الاتزان الكيميائي','قانون الاتزان الكيميائي','ثابت الاتزان','الاتزان المتجانس','الاتزان غير المتجانس'],
 learn:[

const app=$('#app');
function route(){
  cleanups.forEach(f=>{try{f();}catch(e){}});cleanups=[];
  const h=location.hash.replace('#','');
  if(new RegExp('^lesson-[1-'+LESSONS.length+']$').test(h))viewLesson(+h.slice(7));
  else if(h==='final')viewFinal();
  else viewHome();
  fmAll(app);refreshStars();window.scrollTo(0,0);
}
window.addEventListener('hashchange',route);

function badgeHTML(){return '<div class="badges">'+BADGES.map(b=>{const on=b[0]==='final'?(S.final!=null&&S.final>=80):S.done[b[0].slice(1)];return `<div class="badge ${on?'on':''}"><i>${b[1]}</i>${b[2]}</div>`;}).join('')+'</div>';}
function lessonStars(L){let n=L.tasks.filter(t=>S.tasks[t.id]).length;n+=gameStars(S.games[L.game]||0);if((S.quiz[L.n]||0)>=4)n+=3;return n;}
function lessonMax(L){return L.tasks.length+3+3;}

const CH_NO=3;
/* ---------- progress report code for the teacher ---------- */
const RKEY=LS+'-name';
function repHash(str){let h=7;for(const c of str)h=(h*31+c.codePointAt(0))%1000003;return h;}
function repCode(name){const total=LESSONS.length;const done=LESSONS.filter(L=>S.done[L.n]).length;const max=LESSONS.reduce((a,L)=>a+lessonMax(L),0)+5;
  const p={v:1,c:CH_NO,n:name.trim(),d:done,t:total,f:S.final==null?null:S.final,s:totalStars(),m:max,ts:Date.now()};const body=JSON.stringify(p);
  return 'KIM-'+btoa(unescape(encodeURIComponent(body))).replace(/=+$/,'')+'-'+repHash(body).toString(36);}
function reportHTML(){const p=window.Chem22Student&&Chem22Student.get();
  return `<section class="final-band report-band"><div class="rb-in"><div><h3>👩‍🎓 بياناتي وتقدمي</h3>${p?`<p>مسجلة باسم <b>${esc(p.name)}</b> · ${esc(p.grade)} · الشعبة ${esc(p.section)}. يُحفظ تقدمك لدى المعلمة تلقائيًا كلما أنجزتِ درسًا أو اختبارًا، وتجدينه على أي جهاز إذا أدخلتِ البيانات نفسها.</p>`:'<p>سجّلي اسمك الثلاثي وصفك وشعبتك ليُحفظ تقدمك لدى المعلمة، وتجديه على أي جهاز.</p>'}</div>
   <div class="rb-row">${p?'<button type="button" class="btn hot" id="repSync">☁️ حفظ تقدمي الآن</button><button type="button" class="btn" id="repEdit">✏️ تعديل بياناتي</button><button type="button" class="btn cold" id="repGo">رمز التقدم</button>':'<button type="button" class="btn hot" id="repEdit">👩‍🎓 سجّلي بياناتك</button>'}</div>
   <div id="repOut"></div></div></section>`;}
function bindReport(){const ed=$('#repEdit');if(!ed)return;ed.addEventListener('click',()=>Chem22Student.open());

function bubbleAnim(g,{x0,x1,y0,yTop,rate,dur,onTick,onEnd}){
  const NS='http://www.w3.org/2000/svg';let raf=0,acc=0,last=performance.now();const t0=last;const bs=[];
  const step=t=>{const dt=(t-last)/1000;last=t;const k=Math.min(1,(t-t0)/dur);acc+=rate*dt;
    while(acc>=1){acc--;const c=document.createElementNS(NS,'circle');const x=x0+Math.random()*(x1-x0);c.setAttribute('cx',x);c.setAttribute('cy',y0);c.setAttribute('r',1.5+Math.random()*2.5);c.setAttribute('fill','rgba(255,255,255,.85)');c.setAttribute('stroke','rgba(60,90,140,.6)');g.appendChild(c);bs.push({c,x,y:y0,v:40+Math.random()*50});}
    for(let i=bs.length-1;i>=0;i--){const b=bs[i];b.y-=b.v*dt;b.c.setAttribute('cy',b.y);if(b.y<yTop){b.c.remove();bs.splice(i,1);}}
    onTick&&onTick(k);if(k<1)raf=requestAnimationFrame(step);else{bs.forEach(b=>b.c.remove());onEnd&&onEnd();}};
  raf=requestAnimationFrame(step);onCleanup(()=>cancelAnimationFrame(raf));
}
function tween(ms,f,done){if(reduced){f(1);done&&done();return;}const t0=performance.now();let raf=0;const s=t=>{const k=Math.min(1,(t-t0)/ms);f(1-Math.pow(1-k,3));if(k<1)raf=requestAnimationFrame(s);else done&&done();};raf=requestAnimationFrame(s);onCleanup(()=>cancelAnimationFrame(raf));}

/* ---------- hero: N2O4 ⇌ 2NO2 ---------- */
function initBeaker(){
  const cv=$('#beaker'),rng=$('#bT');if(!cv)return;const ctx=cv.getContext('2d');let W=0,H=0,T=300,raf=0;const r=6;let P=[];const ev={f:[],b:[]};
  const fit=()=>{const b=cv.getBoundingClientRect(),d=window.devicePixelRatio||1;W=b.width;H=b.height;cv.width=W*d;cv.height=H*d;ctx.setTransform(d,0,0,d,0,0);};
  fit();const ro=new ResizeObserver(fit);ro.observe(cv);
  const sp=()=>(reduced?0.5:1.4)*Math.sqrt(T/300)*(0.5+Math.random());
  const mk=(t,x,y)=>{const a=Math.random()*6.283,v=sp();return{t,x:x??(r+Math.random()*(W-2*r)),y:y??(r+Math.random()*(H-2*r)),vx:Math.cos(a)*v,vy:Math.sin(a)*v};};
  for(let i=0;i<26;i++)P.push(mk('D'));
  const setT=v=>{T=Math.max(250,Math.min(400,Math.round(v)));rng.value=T;$('#bTv').textContent=T+' K';};
  rng.addEventListener('input',()=>setT(+rng.value));
  let drag=false,sx=0,sT=0;cv.addEventListener('pointerdown',e=>{drag=true;sx=e.clientX;sT=T;cv.setPointerCapture(e.pointerId);});
  cv.addEventListener('pointermove',e=>{if(drag)setT(sT+(e.clientX-sx)*0.4);});cv.addEventListener('pointerup',()=>drag=false);
  const loop=()=>{const now=performance.now();const kf=0.0022*Math.exp((T-300)/22);
    const add=[],rm=new Set();
    for(const p of P){if(p.t==='D'&&Math.random()<kf){rm.add(p);add.push(mk('M',p.x-4,p.y),mk('M',p.x+4,p.y));ev.f.push(now);}}
    for(let i=0;i<P.length;i++){const a=P[i];if(a.t!=='M'||rm.has(a))continue;for(let j=i+1;j<P.length;j++){const b=P[j];if(b.t!=='M'||rm.has(b))continue;const dx=b.x-a.x,dy=b.y-a.y;if(dx*dx+dy*dy<4*r*r&&Math.random()<0.5){rm.add(a);rm.add(b);add.push({t:'D',x:(a.x+b.x)/2,y:(a.y+b.y)/2,vx:(a.vx+b.vx)/2,vy:(a.vy+b.vy)/2});ev.b.push(now);break;}}}
    if(rm.size)P=P.filter(p=>!rm.has(p)).concat(add);
    for(const p of P){p.x+=p.vx;p.y+=p.vy;if(p.x<r||p.x>W-r){p.vx*=-1;p.x=Math.max(r,Math.min(W-r,p.x));}if(p.y<r||p.y>H-r){p.vy*=-1;p.y=Math.max(r,Math.min(H-r,p.y));}}
    const nM=P.filter(p=>p.t==='M').length,nD=P.length-nM;
    ctx.clearRect(0,0,W,H);ctx.fillStyle=`rgba(160,82,45,${0.04+0.5*nM/(nM+2*nD)})`;ctx.fillRect(0,0,W,H);
    for(const p of P){if(p.t==='D'){ctx.fillStyle='#C9D3E0';ctx.strokeStyle='#8090a6';[-4,4].forEach(o=>{ctx.beginPath();ctx.arc(p.x+o,p.y,r-1,0,7);ctx.fill();ctx.stroke();});}else{ctx.beginPath();ctx.arc(p.x,p.y,r,0,7);ctx.fillStyle='#A0522D';ctx.fill();}}
    ev.f=ev.f.filter(t=>now-t<4000);ev.b=ev.b.filter(t=>now-t<4000);
    $('#bPh').innerHTML=`<span class="ltr">N₂O₄: ${nD} | NO₂: ${nM}</span>`;

    raf=requestAnimationFrame(loop);};

}

const SIMS={};
function plotSetup(cv){const ctx=cv.getContext('2d');const o={ctx,W:0,H:0};o.fit=()=>{const b=cv.getBoundingClientRect(),d=window.devicePixelRatio||1;o.W=b.width;o.H=b.height;cv.width=o.W*d;cv.height=o.H*d;ctx.setTransform(d,0,0,d,0,0);};o.fit();return o;}

SIMS.eqSim={title:'الوصول إلى الاتزان',
html:()=>`<h3>الوصول إلى الاتزان: <span class="f">A ⇌ B</span></h3><p class="desc">غيّري ثابتي سرعة التفاعلين الأمامي والعكسي، ثم ابدئي التفاعل. راقبي التراكيز في الرسم الأول، والسرعتين في الرسم الثاني.</p>
 <div class="hc"><canvas id="esC" style="height:340px" aria-label="رسمان: التراكيز والسرعات مع الزمن"></canvas></div>
 <div class="row" style="margin-top:10px"><label class="ctrl">ثابت سرعة التفاعل الأمامي kf: <b class="ltr" id="esFv"></b><input type="range" dir="ltr" id="esF" min="0.2" max="1" step="0.1" value="0.6"></label>
 <label class="ctrl">ثابت سرعة التفاعل العكسي kr: <b class="ltr" id="esRv"></b><input type="range" dir="ltr" id="esR" min="0.1" max="1" step="0.1" value="0.2"></label></div>
 <div class="row" style="margin-top:8px"><button type="button" class="btn sm cold" id="esA">ابدئي من المتفاعلات ([A] = 1 M)</button><button type="button" class="btn sm hot" id="esB">ابدئي من النواتج ([B] = 1 M)</button></div>
 <div class="status wait" id="esOut" style="margin-top:10px">اختاري نقطة البداية.</div>
 <div id="esQ" style="margin-top:12px"></div>`,
init(root){
  const P=plotSetup($('#esC',root));let start=null,prog=1,raf=0;const seen=new Set();
  const lab=()=>{$('#esFv',root).textContent=$('#esF',root).value;$('#esRv',root).textContent=$('#esR',root).value;};
  function draw(){const {ctx,W,H}=P;if(!W)return;const kf=+$('#esF',root).value,kr=+$('#esR',root).value,A0=start==='B'?0:1;const Aeq=kr/(kf+kr);
    const A=t=>Aeq+(A0-Aeq)*Math.exp(-(kf+kr)*t),Tm=10;ctx.clearRect(0,0,W,H);ctx.direction='ltr';const ink=cssv('--muted');ctx.font='12px sans-serif';
    const panels=[[10,H/2-14,'التركيز (M)'],[H/2+8,H-26,'السرعة']];
    panels.forEach(([y0,y1,l],pi)=>{ctx.strokeStyle=ink;ctx.lineWidth=1.5;ctx.beginPath();ctx.moveTo(48,y0);ctx.lineTo(48,y1);ctx.lineTo(W-12,y1);ctx.stroke();ctx.fillStyle=ink;ctx.save();ctx.translate(14,(y0+y1)/2);ctx.rotate(-Math.PI/2);ctx.textAlign='center';ctx.fillText(l,0,0);ctx.restore();
      if(!start)return;const X=t=>48+t/Tm*(W-64),Y=v=>y1-v/(pi?Math.max(kf,kr):1)*(y1-y0-8);const tEnd=Tm*prog;
      const series=pi===0?[[t=>A(t),'#2763D8','[A]'],[t=>1-A(t),'#DE4527','[B]']]:[[t=>kf*A(t),'#2763D8','سرعة الأمامي'],[t=>kr*(1-A(t)),'#DE4527','سرعة العكسي']];
      series.forEach(([f,c,n],si)=>{ctx.strokeStyle=c;ctx.lineWidth=2.5;ctx.beginPath();for(let t=0;t<=tEnd;t+=0.05){const x=X(t),y=Y(f(t));t===0?ctx.moveTo(x,y):ctx.lineTo(x,y);}ctx.stroke();ctx.fillStyle=c;ctx.textAlign='left';ctx.fillText(n,W-110,y0+14+si*15);});
      if(prog>=1){const te=Math.log(50)/(kf+kr);if(te<Tm){ctx.setLineDash([5,4]);ctx.strokeStyle=ink;ctx.beginPath();ctx.moveTo(X(te),y0);ctx.lineTo(X(te),y1);ctx.stroke();ctx.setLineDash([]);if(pi===0){ctx.fillStyle=ink;ctx.textAlign='center';ctx.fillText('الاتزان',X(te),y0+10);}}}});
    ctx.fillStyle=ink;ctx.textAlign='center';ctx.fillText('الزمن',W/2,H-6);
    if(start&&prog>=1){const Ae=Aeq,Be=1-Aeq;$('#esOut',root).className='status ok';$('#esOut',root).innerHTML=`عند الاتزان: [A] = ${Ae.toFixed(2)} M و [B] = ${Be.toFixed(2)} M، والسرعتان متساويتان (${(kf*Ae).toFixed(2)} = ${(kr*Be).toFixed(2)}).<br><span class="ltr">Keq = [B]/[A] = ${(Be/Ae).toFixed(2)} = kf/kr</span>`;}}
  const run=s=>{start=s;seen.add(s);prog=0;cancelAnimationFrame(raf);const t0=performance.now();const st=t=>{prog=reduced?1:Math.min(1,(t-t0)/2500);draw();if(prog<1)raf=requestAnimationFrame(st);else if(seen.size===2)completeTask('l1-start');};raf=requestAnimationFrame(st);};
  $('#esA',root).addEventListener('click',()=>run('A'));$('#esB',root).addEventListener('click',()=>run('B'));
  ['#esF','#esR'].forEach(s=>$(s,root).addEventListener('input',()=>{lab();prog=1;draw();}));
  const ro=new ResizeObserver(()=>{P.fit();draw();});ro.observe($('#esC',root));onCleanup(()=>{ro.disconnect();cancelAnimationFrame(raf);});
  lab();draw();
  mcq(root,'#esQ','ماذا يحدث للسرعتين عند الوصول إلى الاتزان؟',['تتساويان، ويستمر التفاعلان دون توقف','تصبحان صفرًا ويتوقف التفاعل','تصبح سرعة الأمامي أكبر دائمًا','تتساوى تراكيز A و B'],0,()=>completeTask('l1-equal'));
}};

}};

SIMS.keqLab={title:'مختبر ثبات Keq',
html:()=>`<h3>🔬 مختبر: ثبات قيمة Keq (الجدول 3-1)</h3><p class="desc">التفاعل <span class="f">H2(g) + I2(g) ⇌ 2HI(g)</span> عند 731 K في وعاء حجمه 1 L. اختاري كميات ابتدائية مختلفة، وأجري التفاعل حتى الاتزان، ثم قارني قيم Keq.</p>
 <div class="row"><label class="ctrl">[H₂] الابتدائي (M)<select id="klH"><option>1.0000</option><option>2.0000</option><option>0.5000</option><option>0</option></select></label>
 <label class="ctrl">[I₂] الابتدائي (M)<select id="klI"><option>2.0000</option><option>1.0000</option><option>0.5000</option><option>0</option></select></label>
 <label class="ctrl">[HI] الابتدائي (M)<select id="klHI"><option>0</option><option>1.0000</option><option>5.0000</option></select></label>
 <button type="button" class="btn sm hot" id="klGo" style="align-self:flex-end">🧪 أجري التفاعل</button></div>
 <div class="bars3" id="klB"></div>
 <table class="ctable" style="margin-top:10px"><tr><th>المحاولة</th><th>[H₂] عند الاتزان</th><th>[I₂] عند الاتزان</th><th>[HI] عند الاتزان</th><th>Keq = [HI]²/[H₂][I₂]</th></tr><tbody id="klT"></tbody></table>
 <p class="fb" id="klF"></p>
 ${prac('احسبي Keq للتفاعل <span class="f">N2(g) + 3H2(g) ⇌ 2NH3(g)</span> إذا كانت [NH3] = 0.933 M و [N2] = 0.533 M و [H2] = 1.600 M.','',0.399,0.01,'l1-calc','Keq = [NH3]² ÷ ([N2][H2]³)')}
 ${prac('احسبي Keq للاتزان <span class="f">N2O4(g) ⇌ 2NO2(g)</span> إذا كانت [N2O4] = 0.0185 M و [NO2] = 0.0627 M.','',0.2125,0.01,'','Keq = [NO2]² ÷ [N2O4]')}
 ${prac('احسبي Keq للاتزان <span class="f">CO(g) + 3H2(g) ⇌ CH4(g) + H2O(g)</span> إذا كانت [CO] = 0.0613 M و [H2] = 0.1839 M و [CH4] = [H2O] = 0.0387 M.','',3.93,0.01,'','[CH4][H2O] ÷ ([CO][H2]³)')}`,
init(root){const K=49.7;let n=0;
  const bars=(h,i,hi)=>{const mx=Math.max(2.2,h,i,hi);$('#klB',root).innerHTML=[['H₂',h,'#3B7BFF'],['I₂',i,'#8A4FC8'],['HI',hi,'#DE4527']].map(([l,v,c])=>`<div class="b3"><div class="b3t"><i style="height:${v/mx*100}%;background:${c}"></i></div><b class="ltr">${v.toFixed(4)}</b><span>${l}</span></div>`).join('');};
  bars(1,2,0);
  $('#klGo',root).addEventListener('click',()=>{const a=+$('#klH',root).value,b=+$('#klI',root).value,c=+$('#klHI',root).value;const F=$('#klF',root);
    if((a===0||b===0)&&c===0){F.className='fb bad';F.textContent='يلزم وجود H₂ و I₂ معًا، أو وجود HI، حتى يحدث تفاعل.';return;}
    const x=bisect(x=>(c+2*x)**2-K*(a-x)*(b-x),-c/2+1e-12,Math.min(a,b)-1e-12);
    const e=[a-x,b-x,c+2*x];$('#klGo',root).disabled=true;
    tween(1600,k=>bars(a+(e[0]-a)*k,b+(e[1]-b)*k,c+(e[2]-c)*k),()=>{$('#klGo',root).disabled=false;n++;addRow($('#klT',root),[n,e[0].toFixed(4),e[1].toFixed(4),e[2].toFixed(4),(e[2]**2/(e[0]*e[1])).toFixed(2)]);
      F.className='fb ok';F.textContent=n<3?`سجّلتِ ${n} من 3 محاولات. غيّري الكميات الابتدائية وأعيدي.`:'لاحظي: مواضع الاتزان مختلفة، لكن قيمة Keq ثابتة (49.7) عند درجة الحرارة نفسها.';if(n>=3)completeTask('l1-lab');});});
}};

SIMS.shiftSim={title:'محاكي مبدأ لوتشاتلييه',
html:()=>`<h3>محاكي مبدأ لوتشاتلييه: إنتاج الميثان</h3><p class="desc"><span class="f">CO(g) + 3H2(g) ⇌ CH4(g) + H2O(g)</span> و ΔH = −206.5 kJ (طارد). النظام متزن عند 1200 K. اختاري جهدًا وراقبي كيف ينزاح الاتزان.</p>
 <div class="bars3 b4" id="ssB"></div>
 <div class="ssbtns">${[['addCO','➕ إضافة CO'],['remH2O','➖ إزالة H₂O'],['addCH4','➕ إضافة CH₄'],['comp','🔽 تقليل الحجم (زيادة الضغط)'],['exp','🔼 زيادة الحجم'],['heat','🔥 رفع الحرارة'],['cool','❄️ خفض الحرارة'],['cat','⚡ إضافة محفز']].map(([k,l])=>`<button type="button" class="btn sm ghost" data-a="${k}">${l}</button>`).join('')}<button type="button" class="btn sm" id="ssR">↺ إعادة</button></div>
 <div class="status wait" id="ssOut" style="margin-top:10px">النظام في حالة اتزان: Keq = 3.933</div>`,
init(root){let C,K,busy=false;const used=new Set();const NM=['CO','H₂','CH₄','H₂O'],CL=['#3B7BFF','#8A4FC8','#DE4527','#1FAE7A'];
  const reset=()=>{C=[0.3,0.1,0.059,0.02];K=3.933;bars(C,null);$('#ssOut',root).className='status wait';$('#ssOut',root).textContent='النظام في حالة اتزان: Keq = 3.933';};
  function bars(v,old){const mx=Math.max(1.1,...v);$('#ssB',root).innerHTML=v.map((x,i)=>`<div class="b3"><div class="b3t">${old?`<i class="ghost" style="height:${old[i]/mx*100}%"></i>`:''}<i style="height:${x/mx*100}%;background:${CL[i]}"></i></div><b class="ltr">${x.toFixed(4)}</b><span>${NM[i]}</span></div>`).join('');}
  const solve=(c,K)=>{const f=x=>(c[2]+x)*(c[3]+x)-K*(c[0]-x)*Math.pow(c[1]-3*x,3);const x=bisect(f,-Math.min(c[2],c[3])+1e-12,Math.min(c[0],c[1]/3)-1e-12);return [c[0]-x,c[1]-3*x,c[2]+x,c[3]+x];};
  $$('[data-a]',root).forEach(b=>b.addEventListener('click',()=>{if(busy)return;const a=b.dataset.a;const old=C.slice();let d=C.slice(),msg='',cat='';
    if(a==='addCO'){d[0]+=0.7;cat='c';msg='أضفنا CO (متفاعل)';}if(a==='remH2O'){d[3]*=0.5;cat='c';msg='أزلنا نصف H₂O (ناتج)';}if(a==='addCH4'){d[2]+=0.1;cat='c';msg='أضفنا CH₄ (ناتج)';}
    if(a==='comp'){d=d.map(x=>x*2);cat='p';msg='قلّلنا الحجم إلى النصف فتضاعفت التراكيز';}if(a==='exp'){d=d.map(x=>x/2);cat='p';msg='ضاعفنا الحجم فقلّت التراكيز إلى النصف';}
    if(a==='heat'){K*=0.4;cat='t';msg='رفعنا الحرارة: التفاعل طارد، فتقل قيمة Keq';}if(a==='cool'){K*=2.5;cat='t';msg='خفضنا الحرارة: التفاعل طارد، فتزداد قيمة Keq';}
    if(a==='cat'){used.add('k');$('#ssOut',root).className='status ok';$('#ssOut',root).innerHTML='⚡ المحفز يسرّع التفاعلين الأمامي والعكسي بالقدر نفسه: لا إزاحة، ولا تغير في التراكيز أو Keq. فقط يُبلغ الاتزان أسرع.';if(used.size>=3)completeTask('l2-sim');return;}
    used.add(cat);busy=true;bars(d,old);const e=solve(d,K);const dir=e[2]>d[2]+1e-6?'right':e[2]<d[2]-1e-6?'left':'none';
    setTimeout(()=>tween(1400,k=>bars(d.map((x,i)=>x+(e[i]-x)*k),old),()=>{busy=false;C=e;
      $('#ssOut',root).className='status ok';$('#ssOut',root).innerHTML=`${msg} ← ${dir==='right'?'<b>انزاح الاتزان نحو اليمين</b> (تكوين مزيد من CH₄ و H₂O)':dir==='left'?'<b>انزاح الاتزان نحو اليسار</b> (تكوين مزيد من CO و H₂)':'لم ينزح الاتزان'}.<br>Keq = <b class="ltr">${K.toFixed(3)}</b>${cat==='t'?' (قيمة توضيحية بعد تغير الحرارة)':' (لم تتغير)'}`;if(used.size>=3)completeTask('l2-sim');}),600);}));
  $('#ssR',root).addEventListener('click',reset);reset();
}};

SIMS.labConcEq={title:'مختبر: التركيز والاتزان',
html:()=>labShell('lq','مختبر: اتزان أيونات الثيوسيانات الحديدية','<span class="f">Fe³⁺(aq) + SCN⁻(aq) ⇌ FeSCN²⁺(aq)</span>، حيث أيون Fe³⁺ أصفر باهت، وSCN⁻ عديم اللون، وFeSCN²⁺ أحمر. الأنبوب الأيسر للمقارنة، والأيمن للتجربة. أضيفي المواد وراقبي اللون.',
 `<div class="lablbl">أضيفي إلى أنبوب التجربة</div><div class="col-btns"><button type="button" class="btn sm ghost" data-a="fe">💧 قطرات FeCl₃ (تزيد Fe³⁺)</button><button type="button" class="btn sm ghost" data-a="scn">💧 قطرات KSCN (تزيد SCN⁻)</button><button type="button" class="btn sm ghost" data-a="rem">💧 Na₂HPO₄ (يزيل Fe³⁺)</button><button type="button" class="btn sm" data-a="reset">↺ أنبوب جديد</button></div>`)+
 `<table class="ctable" style="margin-top:12px"><tr><th>المادة المضافة</th><th>اللون مقارنة بالأنبوب المرجعي</th><th>اتجاه الإزاحة</th></tr><tbody id="lqT"></tbody></table><div id="lqQ" style="margin-top:12px"></div>`,
init(root){const K=600;let fe,scn;const done=new Set();
  const eq=(f,s)=>bisect(x=>x-K*(f-x)*(s-x),0,Math.min(f,s));
  const col=x=>`rgba(${170+40*(1-x/0.0024)},${25},${25},${Math.min(.95,0.12+x/0.0024*0.8)})`;
  const tube=(cx,x,lbl)=>`<path d="M${cx-22} 40 L${cx-22} 200 Q${cx-22} 228 ${cx} 228 Q${cx+22} 228 ${cx+22} 200 L${cx+22} 40" fill="none" stroke="currentColor" stroke-width="3"/><path d="M${cx-20} 90 L${cx+20} 90 L${cx+20} 200 Q${cx+20} 226 ${cx} 226 Q${cx-20} 226 ${cx-20} 200Z" fill="${col(x)}" ${lbl==='exp'?'id="lqL"':''}/><text x="${cx}" y="250" text-anchor="middle" font-size="12" fill="currentColor">${lbl==='exp'?'التجربة':'المرجع'}</text>`;
  const x0=eq(0.0012,0.0012);
  const scene=x=>{$('#lqS',root).innerHTML=tube(110,x0,'ref')+tube(250,x,'exp')+`<g id="drops"></g>`;};
  const reset=()=>{fe=0.0012;scn=0.0012;scene(eq(fe,scn));setMsg(root,'lq','');};
  $$('[data-a]',root).forEach(b=>b.addEventListener('click',()=>{const a=b.dataset.a;if(a==='reset'){reset();return;}
    const xBefore=eq(fe,scn);if(a==='fe')fe+=0.0012;if(a==='scn')scn+=0.0012;if(a==='rem'){fe-=0.75*(fe-xBefore);}
    const xA=eq(fe,scn);const g=$('#drops',root);g.innerHTML=[0,1,2].map(i=>`<circle cx="250" cy="${10+i*8}" r="4" fill="${a==='fe'?'#E3B23C':a==='scn'?'#ddd':'#cfe8ff'}" stroke="#888"><animate attributeName="cy" from="${10+i*8}" to="95" dur="0.6s" begin="${i*0.15}s" fill="freeze"/></circle>`).join('');
    tween(1500,k=>$('#lqL',root).setAttribute('fill',col(xBefore+(xA-xBefore)*k)),()=>{g.innerHTML='';done.add(a);
      const darker=xA>xBefore;upsertRow($('#lqT',root),a,[a==='fe'?'FeCl₃ (Fe³⁺)':a==='scn'?'KSCN (SCN⁻)':'Na₂HPO₄ (يزيل Fe³⁺)',darker?'أحمر أغمق':'أفتح (أقل احمرارًا)',darker?'نحو اليمين (يتكون FeSCN²⁺)':'نحو اليسار (يتفكك FeSCN²⁺)']);
      setMsg(root,'lq',darker?'زاد تركيز أحد المتفاعلات فانزاح الاتزان نحو اليمين وزاد اللون الأحمر.':'نقص تركيز Fe³⁺ فانزاح الاتزان نحو اليسار لتعويضه، فبهت اللون.');
      if(done.size>=3&&!$('#lqQ .opts',root))mcq(root,'#lqQ','وفق مبدأ لوتشاتلييه، لماذا بهت اللون الأحمر عند إضافة Na₂HPO₄؟',['لأنه أزال أيونات Fe³⁺ فانزاح الاتزان نحو اليسار لتعويضها','لأنه محفز','لأنه زاد قيمة Keq','لأنه رفع درجة الحرارة'],0,()=>completeTask('l2-conc'));});}));
  reset();
}};

SIMS.labPressure={title:'مختبر: الضغط والاتزان',
html:()=>labShell('lp','مختبر: محقن غاز N₂O₄ و NO₂','محقن مغلق فيه خليط متزن: <span class="f">N2O4(g) ⇌ 2NO2(g)</span>، حيث N₂O₄ عديم اللون و NO₂ بني. في الطرف الأيسر مول غاز واحد، وفي الأيمن مولان. اضغطي المكبس أو اسحبيه وراقبي اللون وعدد المولات.',
 `<label class="ctrl">حجم الغاز في المحقن: <b class="ltr" id="lpVv">100 mL</b><input type="range" dir="ltr" id="lpV" min="40" max="100" step="20" value="100"></label><div class="lpinfo" id="lpI"></div>`)+`<div id="lpQ" style="margin-top:12px"></div>`,
init(root){const Kc=0.0046,n0=0.004;let V=0.1,y;const seen=new Set();
  const yeq=V=>{const KV=Kc*V;return(-KV+Math.sqrt(KV*KV+16*KV*n0))/8;};y=yeq(V);
  const frac=y=>2*y/(n0+y);
  const draw=(V,y)=>{const f=frac(y),len=40+V*1000*2.2;const a=Math.max(.05,Math.min(.9,(f-0.12)/0.2*0.75));
    let seed=5;const rnd=()=>{seed=(seed*9301+49297)%233280;return seed/233280;};
    const nN=Math.round((n0-y)*2500),nM=Math.round(2*y*2500);
    const mol=[...Array(nN)].map(()=>{const x=40+rnd()*(len-16),yy=110+rnd()*50;return `<circle cx="${x-3}" cy="${yy}" r="3.2" fill="#E6EBF2" stroke="#8090a6"/><circle cx="${x+3}" cy="${yy}" r="3.2" fill="#E6EBF2" stroke="#8090a6"/>`;}).join('')+[...Array(nM)].map(()=>`<circle cx="${40+rnd()*(len-16)}" cy="${110+rnd()*50}" r="3.4" fill="#8B3A12"/>`).join('');
    $('#lpS',root).innerHTML=`<rect x="30" y="100" width="290" height="70" rx="8" fill="none" stroke="currentColor" stroke-width="3"/><rect x="32" y="102" width="${len}" height="66" fill="rgba(160,82,45,${a})"/>${mol}<rect x="${32+len}" y="96" width="12" height="78" rx="3" fill="#888"/><rect x="${44+len}" y="128" width="${300-len}" height="14" fill="#aaa"/><rect x="330" y="110" width="14" height="50" rx="3" fill="#888"/><rect x="18" y="125" width="14" height="20" fill="#888"/>
      <text x="175" y="200" text-anchor="middle" font-size="13" fill="currentColor">نسبة NO₂ البني في الخليط: ${Math.round(f*100)}%</text><circle cx="112" cy="218" r="3.2" fill="#E6EBF2" stroke="#8090a6"/><circle cx="119" cy="218" r="3.2" fill="#E6EBF2" stroke="#8090a6"/><text x="128" y="222" font-size="11" fill="currentColor" direction="ltr">N₂O₄</text><circle cx="200" cy="218" r="3.4" fill="#8B3A12"/><text x="208" y="222" font-size="11" fill="currentColor" direction="ltr">NO₂</text>`;
    $('#lpI',root).innerHTML=`مولات N₂O₄: <b class="ltr">${((n0-y)*1000).toFixed(2)} mmol</b><br>مولات NO₂: <b class="ltr">${(2*y*1000).toFixed(2)} mmol</b><br>مولات الغاز الكلية: <b class="ltr">${((n0+y)*1000).toFixed(2)} mmol</b>`;};
  draw(V,y);
  $('#lpV',root).addEventListener('change',()=>{const nv=+$('#lpV',root).value/1000;if(nv===V)return;const comp=nv<V;V=nv;$('#lpVv',root).textContent=Math.round(V*1000)+' mL';$('#lpV',root).disabled=true;
    draw(V,y);setMsg(root,'lp',comp?'ضغطتِ المكبس فزاد الضغط… راقبي ما يحدث للخليط.':'سحبتِ المكبس فقلّ الضغط… راقبي ما يحدث للخليط.');
    const y2=yeq(V),y1=y;setTimeout(()=>tween(1800,k=>{y=y1+(y2-y1)*k;draw(V,y);},()=>{$('#lpV',root).disabled=false;seen.add(comp?'c':'e');
      setMsg(root,'lp',comp?'انزاح الاتزان نحو N₂O₄ (مول غاز واحد بدل مولين) لتقليل عدد مولات الغاز وتخفيف الضغط، فقلّ NO₂ البني وأصبح اللون أفتح.':'انزاح الاتزان نحو NO₂ (عدد مولات أكبر) لتعويض نقص الضغط، فزاد NO₂ وأصبح اللون بنيًا أغمق.');
      if(seen.size===2&&!$('#lpQ .opts',root))mcq(root,'#lpQ','عند تقليل حجم المحقن (زيادة الضغط)، ينزاح الاتزان نحو:',['N₂O₄ لأن عدد مولات الغاز فيه أقل، فيفتح اللون','NO₂ لأن عدد مولاته أكبر، فيغمق اللون','لا ينزاح الاتزان','يتوقف التفاعل'],0,()=>completeTask('l2-press'));}),700);});
}};

SIMS.labTempEq={title:'مختبر: الحرارة والاتزان',
html:()=>labShell('lt','مختبر: أنبوب N₂O₄ و NO₂ في حمامات مختلفة','<span class="f">N2O4(g)</span> + حرارة ⇌ <span class="f">2NO2(g)</span> بني. ضعي الأنبوب المغلق في حمام ثلجي أو ماء بدرجة الغرفة أو ماء ساخن، وراقبي اللون.',
 `<div class="lablbl">اختاري الحمام</div>${radioChips('ltB',[['0','❄️ حمام ثلجي <span class="ltr">0 °C</span>'],['25','🌡️ درجة الغرفة <span class="ltr">25 °C</span>'],['80','🔥 ماء ساخن <span class="ltr">80 °C</span>']])}<button type="button" class="btn hot" id="ltGo">ضعي الأنبوب في الحمام</button>`)+
 `<table class="ctable" style="margin-top:12px"><tr><th>الحمام</th><th>لون الغاز</th><th>الاتجاه السائد</th></tr><tbody id="ltT"></tbody></table><div id="ltQ" style="margin-top:12px"></div>`,
init(root){const A={0:0.12,25:0.4,80:0.85};let cur=0.4;const seen=new Set();
  const scene=(T,a)=>{const bath=T==0?'rgba(170,215,240,.6)':T==25?'rgba(200,210,220,.35)':'rgba(240,120,90,.35)';
    $('#ltS',root).innerHTML=`<rect x="70" y="120" width="220" height="115" rx="10" fill="${bath}" stroke="currentColor" stroke-width="2"/>${T==0?[...Array(7)].map((_,i)=>`<rect x="${85+i*28}" y="${130+(i%3)*14}" width="16" height="14" rx="3" fill="#fff" opacity=".8"/>`).join(''):''}${T==80?[...Array(6)].map((_,i)=>`<path d="M${95+i*32} 115 q6 -10 0 -20 q-6 -10 0 -20" stroke="#bbb" fill="none"/>`).join(''):''}
      <path d="M160 30 L160 200 Q160 222 180 222 Q200 222 200 200 L200 30" fill="none" stroke="currentColor" stroke-width="3"/><rect x="156" y="22" width="48" height="12" rx="3" fill="#555"/><path id="ltG" d="M162 36 L198 36 L198 200 Q198 220 180 220 Q162 220 162 200Z" fill="rgba(160,82,45,${a})"/><text x="180" y="252" text-anchor="middle" font-size="12" fill="currentColor" direction="ltr">${T} °C</text>`;};
  bindChips(root,'ltB',v=>scene(+v,cur));scene(0,cur);
  $('#ltGo',root).addEventListener('click',()=>{const T=+chipVal(root,'ltB');const from=cur,to=A[T];scene(T,from);$('#ltGo',root).disabled=true;
    tween(1800,k=>{cur=from+(to-from)*k;$('#ltG',root).setAttribute('fill',`rgba(160,82,45,${cur})`);},()=>{$('#ltGo',root).disabled=false;seen.add(T);
      upsertRow($('#ltT',root),T,[T==0?'ثلجي 0 °C':T==25?'الغرفة 25 °C':'ساخن 80 °C',T==0?'شبه عديم اللون':T==25?'بني فاتح':'بني غامق',T==0?'N₂O₄ (نحو اليسار)':T==25?'خليط متزن':'NO₂ (نحو اليمين)']);
      setMsg(root,'lt',T==80?'التسخين أزاح الاتزان نحو اليمين (الاتجاه الماص) فزاد NO₂ البني، وتزداد Keq.':T==0?'التبريد أزاح الاتزان نحو اليسار (الاتجاه الطارد) فقلّ NO₂، وتقل Keq.':'عند درجة الغرفة يوجد الغازان معًا.');

SIMS.catEq={title:'المحفز والاتزان',
html:()=>`<h3>المحفز والاتزان</h3><p class="desc">قارني تركيز الناتج مع الزمن في تفاعل دون محفز وتفاعل مع محفز يبدآن من التراكيز نفسها.</p>
 <div class="hc"><canvas id="ceC" aria-label="منحنيا التفاعل المحفز وغير المحفز"></canvas></div>
 <div class="row" style="margin-top:8px"><button type="button" class="btn sm cold" id="ceGo">▶ ابدئي التفاعلين</button></div>
 <div id="ceQ" style="margin-top:12px"></div>`,
init(root){const P=plotSetup($('#ceC',root));let prog=0,raf=0;
  const draw=()=>{const {ctx,W,H}=P;if(!W)return;ctx.clearRect(0,0,W,H);ctx.direction='ltr';const ink=cssv('--muted');ctx.strokeStyle=ink;ctx.lineWidth=1.5;ctx.beginPath();ctx.moveTo(48,12);ctx.lineTo(48,H-30);ctx.lineTo(W-12,H-30);ctx.stroke();ctx.fillStyle=ink;ctx.font='12px sans-serif';ctx.textAlign='center';ctx.fillText('الزمن',W/2,H-8);
    ctx.save();ctx.translate(16,H/2);ctx.rotate(-Math.PI/2);ctx.fillText('تركيز الناتج',0,0);ctx.restore();
    const X=t=>48+t/10*(W-64),Y=v=>H-30-v*(H-60);const eqv=0.7;
    [[1.6,'#2763D8','مع محفز'],[0.35,'#DE4527','دون محفز']].forEach(([k,c,l],i)=>{ctx.strokeStyle=c;ctx.lineWidth=2.5;ctx.beginPath();for(let t=0;t<=10*prog;t+=0.05){const v=eqv*(1-Math.exp(-k*t));t===0?ctx.moveTo(X(t),Y(v)):ctx.lineTo(X(t),Y(v));}ctx.stroke();ctx.fillStyle=c;ctx.textAlign='left';ctx.fillText(l,W-100,24+i*16);});
    ctx.setLineDash([5,4]);ctx.strokeStyle=ink;ctx.beginPath();ctx.moveTo(48,Y(eqv));ctx.lineTo(W-12,Y(eqv));ctx.stroke();ctx.setLineDash([]);ctx.fillStyle=ink;ctx.textAlign='left';ctx.fillText('تركيز الاتزان (نفسه)',52,Y(eqv)-6);};
  $('#ceGo',root).addEventListener('click',()=>{cancelAnimationFrame(raf);const t0=performance.now();const s=t=>{prog=reduced?1:Math.min(1,(t-t0)/3000);draw();if(prog<1)raf=requestAnimationFrame(s);};raf=requestAnimationFrame(s);});
  const ro=new ResizeObserver(()=>{P.fit();draw();});ro.observe($('#ceC',root));onCleanup(()=>{ro.disconnect();cancelAnimationFrame(raf);});draw();
  mcq(root,'#ceQ','ما الذي يغيّره المحفز في نظام الاتزان؟',['الزمن اللازم للوصول إلى الاتزان فقط','تركيز الناتج عند الاتزان','قيمة Keq','اتجاه الإزاحة نحو النواتج'],0,()=>completeTask('l2-cat'));

SIMS.eqCalc={title:'حساب تراكيز الاتزان',
html:()=>`<h3>حساب تراكيز الاتزان خطوة بخطوة</h3><p class="desc">ما تركيز H₂ عند الاتزان للتفاعل <span class="f">2H2S(g) ⇌ 2H2(g) + S2(g)</span> إذا كان Keq = 2.27 × 10⁻³ و [H2S] = 0.184 mol/L و [S2] = 0.0540 mol/L؟</p>

 ${prac('<span class="f">CO(g) + 3H2(g) ⇌ CH4(g) + H2O(g)</span> و Keq = 3.933. ما [CH4] إذا كانت [CO] = 0.850 M و [H2] = 1.333 M و [H2O] = 0.286 M؟','mol/L',27.7,0.02,'','[CH4] = Keq × [CO][H2]³ ÷ [H2O]')}
 ${prac('<span class="f">CO(g) + 2H2(g) ⇌ CH3OH(g)</span> و Keq = 10.5. ما [CO] في خليط اتزان يحتوي على 0.933 M من H2 و 1.32 M من CH3OH؟','mol/L',0.1444,0.02,'','[CO] = [CH3OH] ÷ (Keq × [H2]²)')}`,

SIMS.labPrecip={title:'مختبر: توقع الراسب',

 `<div class="status wait" id="lrOut" style="margin-top:10px"></div>
 <table class="ctable" style="margin-top:10px"><tr><th>الخليط</th><th>Qsp</th><th>Ksp</th><th>النتيجة</th></tr><tbody id="lrT"></tbody></table>
 ${prac('مثال الكتاب: أُضيف 100 mL من <span class="f">0.0100 M NaCl</span> إلى 100 mL من <span class="f">0.0200 M Pb(NO3)2</span>. احسبي Qsp لـ PbCl2 (تذكري أن كل تركيز يصبح النصف بعد الخلط).','',2.5e-7,0.03,'l3-q','[Pb²⁺] = 0.0100 و [Cl⁻] = 0.00500، ثم Qsp = [Pb²⁺][Cl⁻]²')}`,

    tween(1500,k=>scene(p,ppt,k));addRow($('#lrT',root),[`${p.a[0]} ${A*2} M + ${p.b[0]} ${B*2} M`,sci(Q),sci(p.Ksp),ppt?'راسب':'لا راسب']);

  lab();
}};

function initGame(root,g){
  const box=$('.gbox',root);const id=Object.keys(GAMES).find(k=>GAMES[k]===g);let timer=null,score=0,left=45,deck=[],busy=false;
  const starRow=n=>'<div class="stars3">'+[1,2,3].map(i=>`<span class="${i<=n?'':'off'}">★</span>`).join('')+'</div>';
  const intro=()=>{const b=S.games[id]||0;box.innerHTML=`${starRow(gameStars(b))}<p style="margin:0">أفضل نتيجة: <b>${b}</b></p><button type="button" class="btn hot">ابدئي التحدي</button>`;$('button',box).addEventListener('click',start);};
  const next=()=>{let it;
    if(g.gen)it=g.gen();else{if(!deck.length)deck=shuffle(g.items);const x=deck.pop();it={p:x[0],o:g.labels,a:x[1]};}
    box.innerHTML=`<div class="ghead"><span>النقاط: ${score}</span><span class="timer">⏱ ${left}s</span></div><div class="gprompt">${g.gen?it.p:fm(it.p)}</div><div class="gopts">${it.o.map((o,i)=>`<button type="button" class="opt" data-i="${i}">${o}</button>`).join('')}</div>`;
    fmAll(box);busy=false;
    $$('.opt',box).forEach(b=>b.addEventListener('click',()=>{if(busy)return;busy=true;const ok=+b.dataset.i===it.a;
      if(ok){score++;b.classList.add('ok');box.classList.add('flash-ok');}else{b.classList.add('bad');$$('.opt',box)[it.a].classList.add('ok');box.classList.add('flash-bad');}
      setTimeout(()=>{box.classList.remove('flash-ok','flash-bad');if(left>0)next();},ok?260:650);}));};
  const tick=()=>{left--;const t=$('.timer',box);if(t)t.textContent='⏱ '+left+'s';if(left<=0)end();};
  const start=()=>{score=0;left=45;deck=[];next();clearInterval(timer);timer=setInterval(tick,1000);};
  const end=()=>{clearInterval(timer);const prev=S.games[id]||0;const before=gameStars(prev);if(score>prev){S.games[id]=score;save();refreshStars();}
    const st=gameStars(Math.max(prev,score));
    box.innerHTML=`<div class="gscore">${score}</div><p style="margin:0">إجابة صحيحة في 45 ثانية</p>${starRow(gameStars(score))}<p style="margin:0;color:var(--muted)">أفضل نتيجة: ${Math.max(prev,score)}</p><button type="button" class="btn hot">العبي مرة أخرى</button>`;
    $('button',box).addEventListener('click',start);if(st>before)toast('★ نجوم جديدة من التحدي!');};
  onCleanup(()=>clearInterval(timer));intro();
}

/* ---------- quiz runner ---------- */
function quizRunner(el,qs,opt){
  let order,idx,score,wrong;
  const begin=()=>{order=qs.map(q=>{const p=shuffle(q.o.map((t,i)=>({t,i})));return{...q,opts:p,ans:p.findIndex(x=>x.i===q.a)};});if(opt.shuffle!==false)order=shuffle(order);idx=0;score=0;wrong=[];show();};
  const show=()=>{const q=order[idx];
    el.innerHTML=`<div class="qr"><div class="qtop"><span>السؤال ${idx+1} من ${order.length}${q.y?'<span class="yr">'+(q.y==='--'?'تجميعات':'تحصيلي '+q.y)+'</span>':''}</span><span class="qsc">صحيحة: ${score}</span></div>
     <div class="qbar"><i style="width:${idx/order.length*100}%"></i></div>
     <div class="qtext">${q.q}</div>
     <div class="opts">${q.opts.map((o,i)=>`<button type="button" class="opt" data-i="${i}"><span dir="auto">${fm(o.t)}</span></button>`).join('')}</div>
     <div class="qx"></div></div>`;
    fmAll(el);
    $$('.opt',el).forEach(b=>b.addEventListener('click',()=>{const i=+b.dataset.i;$$('.opt',el).forEach(x=>x.disabled=true);
      const ok=i===q.ans;if(ok)score++;else wrong.push(q);b.classList.add(ok?'ok':'bad');$$('.opt',el)[q.ans].classList.add('ok');
      $('.qx',el).innerHTML=`<div class="exp ${ok?'ok':'bad'}"><b>${ok?'✓ إجابة صحيحة.':'✗ الإجابة الصحيحة: '+fm(q.opts[q.ans].t)}</b> ${q.e||''}</div><div class="qnav"><button type="button" class="btn">${idx<order.length-1?'السؤال التالي':'عرض النتيجة'}</button></div>`;
      $('.qsc',el).textContent='صحيحة: '+score;
      $('.qnav button',el).addEventListener('click',()=>{idx++;if(idx<order.length)show();else finish();});
      $('.qnav button',el).focus();}));};
  const finish=()=>{const pct=Math.round(score/order.length*100);opt.onDone&&opt.onDone(score,order.length,pct);
    const msg=pct>=90?'ممتاز! أداء متقن.':pct>=80?'رائع! أنتِ مستعدة.':pct>=60?'جيد، راجعي الأسئلة التي أخطأتِ فيها.':'لا بأس، راجعي الدروس وحاولي مرة أخرى.';
    el.innerHTML=`<div class="qr result"><div class="gscore">${score} / ${order.length}</div><p style="margin:4px 0;font-weight:600">${pct}%: ${msg}</p>
     <div class="row" style="justify-content:center;margin-top:10px"><button type="button" class="btn" id="qAgain">أعيدي الاختبار</button>${opt.extra||''}</div>
     ${wrong.length?'<div class="review"><b>راجعي هذه الأسئلة:</b>'+wrong.map(w=>`<div>${w.q}<br><b>الإجابة:</b> <span dir="auto">${fm(w.opts[w.ans].t)}</span>. ${w.e||''}</div>`).join('')+'</div>':''}</div>`;
    fmAll(el);$('#qAgain',el).addEventListener('click',()=>opt.restart?opt.restart():begin());};
  if(opt.autostart===false)return{begin};begin();return{begin};
}

function botSugg(){const n=(location.hash.match(/lesson-(\d)/)||[])[1];const base={1:['ما معنى الاتزان الديناميكي؟','كيف أكتب تعبير ثابت الاتزان؟','لماذا لا نكتب المواد الصلبة في Keq؟'],2:['اشرحي لي مبدأ لوتشاتلييه بمثال','ماذا يحدث للاتزان عند زيادة الضغط؟','لماذا لا يزيح المحفز الاتزان؟'],3:['كيف أحسب الذائبية من Ksp؟','متى يتكون راسب؟','ما تأثير الأيون المشترك؟']}[n]||['اشرحي لي الاتزان الكيميائي ببساطة','ما مبدأ لوتشاتلييه؟','كيف أحسب Keq؟'];
  $('#botSugg').innerHTML=base.map(q=>`<button type="button">${esc(q)}</button>`).join('');$$('#botSugg button').forEach(b=>b.addEventListener('click',()=>botAsk(b.textContent)));}
async function botAsk(q){
  q=(q||'').trim();if(!q||BOT.busy)return;BOT.busy=true;$('#botSend').disabled=true;$('#botIn').value='';
  botAdd('me',esc(q));BOT.turns.push({role:'user',content:q.slice(0,1500)});

      body:JSON.stringify({ch:CH_NO,lesson:n?LESSONS[n-1].code+' '+LESSONS[n-1].title:'',messages:BOT.turns.slice(-10)})});

  }catch(e){

    if(code==='rate_limited')botAdd('err','وصلتِ إلى الحد المسموح من الأسئلة الآن. حاولي بعد قليل.');

    else botAdd('err','تعذّر الحصول على إجابة الآن. حاولي مرة أخرى بعد قليل.');
  }finally{clearTimeout(to);BOT.busy=false;$('#botSend').disabled=false;}
}

    const fi=$('#sFile'),dr=$('#sDrop');
    $('#sName').addEventListener('input',e=>draft.name=e.target.value);$('#sNote').addEventListener('input',e=>draft.note=e.target.value);
    dr.addEventListener('click',()=>fi.click());dr.addEventListener('keydown',e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();fi.click();}});
    dr.addEventListener('dragover',e=>{e.preventDefault();dr.classList.add('over');});dr.addEventListener('dragleave',()=>dr.classList.remove('over'));
    dr.addEventListener('drop',e=>{e.preventDefault();dr.classList.remove('over');addFiles(e.dataTransfer.files);});
    fi.addEventListener('change',()=>addFiles(fi.files));
    $$('[data-rm]',el).forEach(b=>b.addEventListener('click',()=>{const f=draft.files[+b.dataset.rm];draft.files.splice(+b.dataset.rm,1);const inSaved=mine&&(mine.files||[]).some(x=>x.id===f.id);if(!inSaved&&f.id)assets.delete(f.id).catch(()=>{});renderMine();}));
    $('#sSend').addEventListener('click',submit);
  }
  async function addFiles(list){
    const fb=()=>$('#sFb');
    for(const f of Array.from(list)){
      const t=guessType(f);
      if(!OK_TYPES.test(t)){if(fb()){fb().className='fb bad';fb().textContent='الملف «'+f.name+'» بصيغة غير مدعومة. استعملي صورة JPG أو PNG أو ملف PDF.';}continue;}
      if(f.size>20*1048576){if(fb()){fb().className='fb bad';fb().textContent='الملف «'+f.name+'» أكبر من 20 MB.';}continue;}
      const item={name:f.name,size:f.size};draft.files.push(item);renderMine();
      try{const r=await assets.upload(f,{type:t});item.id=r.id;item.size=r.sizeBytes;item.type=r.contentType;}
      catch(e){draft.files.splice(draft.files.indexOf(item),1);if(fb()){fb().className='fb bad';fb().textContent=e&&e.code==='quota_exceeded'?'امتلأت مساحة التخزين في المنصة. أخبري معلمتك.':'تعذّر رفع «'+f.name+'». جرّبي مرة أخرى أو بصيغة أخرى.';}}
      renderMine();
    }
  }
  async function submit(){
    const fb=$('#sFb');
    if(draft.files.some(f=>!f.id)){fb.className='fb bad';fb.textContent='انتظري حتى يكتمل رفع الملفات.';return;}
    if(!draft.name.trim()){fb.className='fb bad';fb.textContent='اكتبي اسمك وشعبتك.';return;}
    if(!draft.files.length){fb.className='fb bad';fb.textContent='ارفعي ملف إجابتك أولًا.';return;}
    $('#sSend').disabled=true;
    try{await db.doc('submissions/'+uid).set({aid:A.id,name:draft.name.trim(),note:draft.note.trim(),files:draft.files.map(f=>({id:f.id,name:f.name,size:f.size||0,type:f.type||''})),at:new Date().toISOString()});toast('📎 تم تسليم المهمة بنجاح');}
    catch(e){fb.className='fb bad';fb.textContent=e&&e.code==='invalid_argument'?'لا تملكين صلاحية التسليم. اطلبي من معلمتك صلاحية «مساهِمة».':'تعذّر التسليم الآن. حاولي مرة أخرى.';if($('#sSend'))$('#sSend').disabled=false;}
  }

  /* --- teacher --- */
  if(teacher){
    const unS=db.collection('submissions').onSnapshot(q=>{subsLoaded=true;subs=q.docs.map(d=>({uid:d.id,...d.data()}));renderSubs();},()=>{subsLoaded=true;renderSubs();});
    onCleanup(unS);
  }
  async function renderSubs(){
    const el=$('#sBox');if(!el||!teacher)return;
    if(!subsLoaded){el.innerHTML='<p class="hint" style="margin-top:14px">جارٍ تحميل التسليمات…</p>';return;}
    const cur=subs.filter(x=>A&&x.aid===A.id).sort((a,b)=>(b.at||'').localeCompare(a.at||''));
    const old=subs.filter(x=>!A||x.aid!==A.id);
    let names={};try{if(user)names=await user.profiles(subs.map(x=>x.uid));}catch(e){}
    if(!$('#sBox'))return;
    const card=x=>{const p=names[x.uid];const acc=p&&p.name?` <span style="color:var(--muted);font-size:13.5px">(${esc(p.name)})</span>`:'';
      return `<div class="subcard"><div class="row" style="justify-content:space-between"><b>${esc(x.name||'بدون اسم')}${acc}</b><span class="hint" style="margin:0">${esc(fdate(x.at))}</span></div>
      ${x.note?`<div style="font-size:15px">📝 ${esc(x.note)}</div>`:''}
      <div class="flist">${(x.files||[]).map(f=>`<div class="fitem"><span>${fileLink(f)}</span></div>`).join('')}</div>
      <div class="row"><input class="ans" style="width:110px;text-align:center" data-g="${esc(x.uid)}" value="${esc(x.grade||'')}" placeholder="الدرجة" aria-label="الدرجة"><input class="tinput" style="flex:1;min-width:160px" data-f="${esc(x.uid)}" value="${esc(x.feedback||'')}" placeholder="ملاحظة للطالبة" aria-label="ملاحظة"><button type="button" class="btn sm" data-sv="${esc(x.uid)}">حفظ</button></div></div>`;};
    el.innerHTML=`<div style="margin-top:20px"><h3 style="margin:0 0 4px">تسليمات الطالبات (${cur.length})</h3><p class="hint" style="margin:0">تظهر هذه القائمة لك فقط. الدرجة والملاحظة تظهران للطالبة في صفحة تسليمها.</p>
      <div class="subgrid">${cur.length?cur.map(card).join(''):'<div class="notice">لم تصل تسليمات لهذه المهمة بعد.</div>'}</div>
      ${old.length?`<button type="button" class="btn sm ghost" id="oldT" style="margin-top:14px">${showOld?'إخفاء':'عرض'} تسليمات المهام السابقة (${old.length})</button>${showOld?`<div class="subgrid">${old.map(card).join('')}</div>`:''}`:''}</div>`;
    const oT=$('#oldT');if(oT)oT.addEventListener('click',()=>{showOld=!showOld;renderSubs();});
    $$('[data-sv]',el).forEach(b=>b.addEventListener('click',async()=>{const id=b.dataset.sv;b.disabled=true;
      try{await db.doc('submissions/'+id).update({grade:$(`[data-g="${id}"]`,el).value.trim(),feedback:$(`[data-f="${id}"]`,el).value.trim()});toast('حُفظت الملاحظة');}
      catch(e){toast('تعذّر الحفظ');}finally{b.disabled=false;}}));
  }
}

applyTheme();
initBot();
window.matchMedia('(prefers-color-scheme: dark)').addEventListener('change',()=>{applyTheme();window.dispatchEvent(new Event('themechange'));});
route();
if(window.Chem22Student){restoreProgress();Chem22Student.onChange(()=>{if(!location.hash||location.hash==="#home")route();restoreProgress();});}
</script>
</body>
